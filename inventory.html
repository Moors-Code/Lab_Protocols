<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freezer Inventory · SyPhy-lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ── Design tokens ─────────────────────────────────────────────── */
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface2: #f0f2f5;
  --surface3: #e8eaed;
  --border: #dde1e7;
  --text: #1c1e26;
  --text2: #6b7280;
  --text3: #9ca3af;
  --accent: #2563eb;
  --accent-lt: #dbeafe;
  --accent-dark: #1d4ed8;
  --box-bg: #fffbeb;
  --box-border: #d97706;
  --box-text: #92400e;
  --danger: #dc2626;
  --danger-lt: #fee2e2;
  --success: #16a34a;
  --warn: #d97706;
  --warn-lt: #fef3c7;
  --rad: 8px;
  --rad-sm: 5px;
  --shadow: 0 1px 3px rgba(0,0,0,.1);
  --shadow-lg: 0 8px 30px rgba(0,0,0,.15);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0d0f14;--surface:#161920;--surface2:#1e2129;--surface3:#272b35;
  --border:#2a2f3d;--text:#e4e6eb;--text2:#8b949e;--text3:#6e7681;
  --accent:#5b9bd5;--accent-lt:#162035;--accent-dark:#4a8fc7;
  --box-bg:#1f1a0a;--box-border:#b45309;--box-text:#fbbf24;
  --danger:#f87171;--danger-lt:#2d1515;--success:#4ade80;--warn:#fbbf24;--warn-lt:#292008;
}}
:root[data-theme="dark"] {
  --bg:#0d0f14;--surface:#161920;--surface2:#1e2129;--surface3:#272b35;
  --border:#2a2f3d;--text:#e4e6eb;--text2:#8b949e;--text3:#6e7681;
  --accent:#5b9bd5;--accent-lt:#162035;--accent-dark:#4a8fc7;
  --box-bg:#1f1a0a;--box-border:#b45309;--box-text:#fbbf24;
  --danger:#f87171;--danger-lt:#2d1515;--success:#4ade80;--warn:#fbbf24;--warn-lt:#292008;
}
:root[data-theme="light"] {
  --bg:#f4f5f7;--surface:#ffffff;--surface2:#f0f2f5;--surface3:#e8eaed;
  --border:#dde1e7;--text:#1c1e26;--text2:#6b7280;--text3:#9ca3af;
  --accent:#2563eb;--accent-lt:#dbeafe;--accent-dark:#1d4ed8;
  --box-bg:#fffbeb;--box-border:#d97706;--box-text:#92400e;
  --danger:#dc2626;--danger-lt:#fee2e2;--success:#16a34a;--warn:#d97706;--warn-lt:#fef3c7;
}

/* ── Reset & base ──────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font-family:inherit;font-size:inherit}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

/* ── Layout ────────────────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── Top bar ───────────────────────────────────────────────────── */
#topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 16px;display:flex;align-items:center;gap:10px;
  min-height:52px;flex-shrink:0;box-shadow:var(--shadow);position:relative;z-index:10;
}
#wordmark{font-weight:600;font-size:15px;white-space:nowrap;color:var(--text);display:flex;align-items:center;gap:6px;flex-shrink:0}
#wordmark .accent{color:var(--accent)}
#tabs-scroll{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
#tabs-scroll::-webkit-scrollbar{display:none}
.tab-btn{
  padding:5px 14px;border:none;background:transparent;
  color:var(--text2);cursor:pointer;border-radius:var(--rad-sm);
  font-size:13px;font-weight:500;white-space:nowrap;
  transition:background .15s,color .15s;flex-shrink:0;
}
.tab-btn:hover{background:var(--surface2);color:var(--text)}
.tab-btn.active{background:var(--accent-lt);color:var(--accent);font-weight:600}
.topbar-right{display:flex;gap:6px;align-items:center;flex-shrink:0}
#search-wrap{position:relative}
#search-input{
  width:210px;padding:6px 10px 6px 30px;
  border:1px solid var(--border);border-radius:var(--rad);
  background:var(--surface2);color:var(--text);font-size:13px;
  transition:border-color .15s;
}
#search-input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
.icon-btn{
  width:34px;height:34px;border:1px solid var(--border);border-radius:var(--rad);
  background:var(--surface);color:var(--text2);cursor:pointer;
  font-size:15px;display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--surface2);color:var(--text)}
.icon-btn.filter-active{background:var(--warn-lt)!important;color:var(--warn)!important;border-color:var(--warn)!important}

/* ── Breadcrumb bar ─────────────────────────────────────────────── */
#crumbbar{
  background:var(--surface2);border-bottom:1px solid var(--border);
  padding:6px 16px;display:flex;align-items:center;gap:8px;
  flex-shrink:0;min-height:38px;
}
.crumb{font-size:13px;color:var(--text2)}
.crumb.link{cursor:pointer;color:var(--accent)}
.crumb.link:hover{text-decoration:underline}
.crumb.current{color:var(--text);font-weight:500}
.crumb-sep{color:var(--text3);font-size:12px}
.crumbbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.back-btn{
  padding:3px 10px;border:1px solid var(--border);border-radius:var(--rad-sm);
  background:var(--surface);color:var(--text);cursor:pointer;font-size:12px;
}
.back-btn:hover{background:var(--surface3)}

/* ── Main scroll area ──────────────────────────────────────────── */
#main{flex:1;overflow-y:auto;padding:20px 16px 40px}

/* ── Grid view ──────────────────────────────────────────────────── */
.grid-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.grid-header h2{font-size:17px;font-weight:600}
.btn-add-box{
  padding:6px 14px;background:var(--accent);color:#fff;
  border:none;border-radius:var(--rad);cursor:pointer;
  font-size:13px;font-weight:500;
}
.btn-add-box:hover{background:var(--accent-dark)}

/* Cross-results banner */
.cross-banner{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);
  padding:8px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
}
.cross-banner-label{font-size:12px;color:var(--text2);font-weight:500}
.cross-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:20px;
  border:1px solid var(--danger);background:transparent;
  color:var(--danger);cursor:pointer;font-size:12px;
  transition:background .15s,color .15s;
}
.cross-chip:hover{background:var(--danger);color:#fff}
.rdot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}

/* Grid table */
.grid-wrap{max-width:860px}
.grid-table{display:grid;grid-template-columns:22px repeat(9,1fr);gap:3px}
.gc-corner,.gc-col-label{
  font-size:10px;color:var(--text3);font-family:'IBM Plex Mono',monospace;
  text-align:center;padding:2px;display:flex;align-items:center;justify-content:center;
}
.gc-row-label{
  font-size:10px;color:var(--text3);font-family:'IBM Plex Mono',monospace;
  display:flex;align-items:center;justify-content:center;
}
.gc{
  aspect-ratio:1;border-radius:var(--rad-sm);border:1px solid var(--border);
  background:var(--surface);cursor:pointer;
  font-family:'IBM Plex Mono',monospace;font-size:8.5px;line-height:1.2;
  padding:4px 3px;text-align:center;
  display:flex;align-items:center;justify-content:center;
  word-break:break-word;hyphens:auto;overflow:hidden;
  transition:opacity .2s,border-color .15s,background .15s;
  position:relative;
}
.gc:hover{border-color:var(--accent);background:var(--accent-lt)}
.gc.empty{color:var(--text3)}
.gc.empty:hover::after{content:'+';font-size:18px;color:var(--accent);font-family:'IBM Plex Sans',sans-serif;position:absolute}
.gc.empty:hover span{opacity:0}
.gc.box-cell{background:var(--box-bg);border-color:var(--box-border);color:var(--box-text);font-weight:700;font-size:9.5px}
.gc.box-cell:hover{background:var(--box-border);color:#fff}
.gc.item-cell{background:var(--surface2);color:var(--text)}
.gc.item-cell:hover{background:var(--accent-lt);border-color:var(--accent)}
.gc.dimmed{opacity:.28;pointer-events:none}
.gc .badge-dot{position:absolute;top:2px;left:2px;width:7px;height:7px;border-radius:50%;background:var(--danger)}

/* ── Box panel ──────────────────────────────────────────────────── */
.box-panel-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.box-panel-header h2{font-size:17px;font-weight:600}
.btn-add-item{
  padding:6px 14px;background:var(--accent);color:#fff;
  border:none;border-radius:var(--rad);cursor:pointer;
  font-size:13px;font-weight:500;margin-left:auto;
}
.btn-add-item:hover{background:var(--accent-dark)}

.items-table{width:100%;border-collapse:collapse}
.items-table th{
  text-align:left;padding:8px 10px;font-size:11px;font-weight:600;color:var(--text2);
  border-bottom:2px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;
}
.items-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13px}
.items-table tr:last-child td{border-bottom:none}
.items-table tr.dimmed td{opacity:.35}
.name-cell{font-weight:500}
.lc-link{color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:11.5px}
.mono{font-family:'IBM Plex Mono',monospace;font-size:12px}

/* Volume */
.vol-wrap{display:flex;align-items:center;gap:6px}
.vol-num{font-family:'IBM Plex Mono',monospace;font-size:12px;min-width:44px}
.low-badge{
  font-size:10px;background:var(--warn-lt);color:var(--warn);
  padding:1px 5px;border-radius:3px;border:1px solid var(--warn);white-space:nowrap;
}
.use-vol-btn{
  padding:2px 8px;border:1px solid var(--border);border-radius:4px;
  background:transparent;color:var(--text2);cursor:pointer;font-size:11px;
}
.use-vol-btn:hover{border-color:var(--accent);color:var(--accent)}
.vol-form{display:inline-flex;align-items:center;gap:4px}
.vol-form input{
  width:70px;padding:2px 6px;border:1px solid var(--accent);border-radius:4px;
  background:var(--surface);color:var(--text);
  font-family:'IBM Plex Mono',monospace;font-size:12px;
}
.vol-form .apply{padding:2px 8px;border:none;background:var(--accent);color:#fff;border-radius:4px;cursor:pointer;font-size:11px}
.vol-form .apply:hover{background:var(--accent-dark)}
.vol-form .cancel{padding:2px 6px;border:1px solid var(--border);background:transparent;color:var(--text2);border-radius:4px;cursor:pointer;font-size:11px}

/* Row actions */
.row-actions{display:flex;gap:5px}
.btn-edit,.btn-del{padding:3px 9px;border-radius:4px;cursor:pointer;font-size:12px;border:1px solid;transition:background .12s,color .12s}
.btn-edit{border-color:var(--border);background:transparent;color:var(--text2)}
.btn-edit:hover{border-color:var(--accent);color:var(--accent)}
.btn-del{border-color:var(--danger);background:transparent;color:var(--danger)}
.btn-del:hover{background:var(--danger);color:#fff}
.btn-pick{padding:3px 9px;border-radius:4px;cursor:pointer;font-size:12px;border:1px solid #0891b2;background:transparent;color:#0891b2;font-weight:600}
.btn-pick:hover{background:#0891b2;color:#fff}
.picker-banner{position:sticky;top:0;z-index:50;background:#0891b2;color:#fff;text-align:center;padding:8px 16px;font-size:13px;font-weight:500;letter-spacing:.01em;box-shadow:0 2px 6px rgba(0,0,0,.2)}

/* Empty state */
.empty-state{text-align:center;padding:52px 16px;color:var(--text2)}
.empty-state h3{font-size:16px;margin-bottom:6px;color:var(--text)}

/* ── Modals ─────────────────────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;
}
.modal{
  background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);
  width:100%;max-width:460px;max-height:92vh;overflow-y:auto;
}
.modal.wide{max-width:540px}
.modal-hd{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:var(--surface);z-index:1;
}
.modal-hd h3{font-size:16px;font-weight:600}
.modal-x{
  width:28px;height:28px;border:none;border-radius:50%;
  background:var(--surface2);color:var(--text2);cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;
}
.modal-x:hover{background:var(--surface3);color:var(--text)}
.modal-bd{padding:20px}
.modal-ft{
  padding:14px 20px;border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:8px;
  position:sticky;bottom:0;background:var(--surface);
}
.modal-err-wrap{margin-bottom:12px}
.modal-err{background:var(--danger-lt);color:var(--danger);padding:9px 13px;border-radius:var(--rad-sm);font-size:13px}

/* Forms */
.frow{margin-bottom:13px}
.frow.req label::after{content:' *';color:var(--danger)}
.frow label{display:block;font-size:11.5px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.finput{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--rad);
  background:var(--surface2);color:var(--text);font-size:14px;
}
.finput:focus{outline:2px solid var(--accent);border-color:transparent}
.fhint{font-size:11px;color:var(--text3);margin-top:3px}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Buttons */
.btn-primary{padding:8px 18px;background:var(--accent);color:#fff;border:none;border-radius:var(--rad);cursor:pointer;font-size:14px;font-weight:500}
.btn-primary:hover{background:var(--accent-dark)}
.btn-secondary{padding:8px 16px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:var(--rad);cursor:pointer;font-size:14px}
.btn-secondary:hover{background:var(--surface2)}
.btn-danger2{padding:8px 16px;background:transparent;color:var(--danger);border:1px solid var(--danger);border-radius:var(--rad);cursor:pointer;font-size:14px}
.btn-danger2:hover{background:var(--danger);color:#fff}

/* Settings */
.settings-section{margin-bottom:22px}
.settings-section:last-child{margin-bottom:0}
.settings-section h4{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.toggle-lbl{font-size:14px}
.toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:11px;cursor:pointer;transition:background .2s}
.toggle-slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle input:checked~.toggle-slider{background:var(--accent)}
.toggle input:checked~.toggle-slider::before{transform:translateX(18px)}

/* Loading / error */
.loading-wrap{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text2);gap:10px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err-banner{background:var(--danger-lt);color:var(--danger);padding:12px 16px;border-radius:var(--rad);margin-bottom:14px;font-size:13px}

/* Toast */
#toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--text);color:var(--bg);padding:9px 18px;border-radius:20px;
  font-size:13px;z-index:2000;transition:transform .3s;
  pointer-events:none;white-space:nowrap;box-shadow:var(--shadow-lg);
}
#toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:600px){
  #search-input{width:140px}
  .gc{font-size:7px}
}

/* ── Box cards (freezer overview) ──────────────────────────── */
.box-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;padding:6px 0}
.box-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);padding:18px 16px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.box-card:hover{border-color:var(--accent);box-shadow:var(--shadow-lg)}
.box-card-icon{font-size:26px;margin-bottom:8px}
.box-card-name{font-weight:600;font-size:15px;margin-bottom:4px;color:var(--text)}
.box-card-count{font-size:13px;color:var(--text2)}
.box-card-badge{display:inline-block;background:var(--accent);color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 7px;margin-left:6px;vertical-align:middle}
/* Box colour tags */
.box-color-btn{position:absolute;top:8px;right:8px;width:16px;height:16px;border-radius:50%;cursor:pointer;border:1.5px dashed var(--border);background:var(--surface2);opacity:0;transition:opacity .15s;padding:0;z-index:2}
.box-card:hover .box-color-btn,.box-color-btn[data-colored]{opacity:1}
.box-color-btn[data-colored]{border:none;opacity:.7}
.box-color-btn[data-colored]:hover{opacity:1}
.box-color-pop{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px;box-shadow:0 4px 20px rgba(0,0,0,.2);display:flex;flex-wrap:wrap;gap:5px;width:130px;z-index:9999}
.color-sw{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:transform .12s}
.color-sw:hover{transform:scale(1.2)}
.color-sw.selected{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text)}
.color-sw-none{background:var(--surface2)!important;border:1.5px dashed var(--border)!important;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:11px;font-weight:700;line-height:1}

/* ── Plate grid (box physical layout) ─────────────────────── */
.plate-wrap{margin-bottom:20px}
.plate-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.plate-grid{display:grid;grid-template-columns:26px repeat(9,1fr);gap:3px;overflow-x:auto}
.pg-corner{width:26px}
.pg-col{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--text3);height:22px}
.pg-row{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--text3);height:50px;width:26px}
.pg-cell{height:50px;border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:2px 3px;font-size:9px;text-align:center;word-break:break-all;line-height:1.2;transition:all .15s}
.pg-cell.empty{background:var(--surface2);border:1px dashed var(--border);cursor:pointer}
.pg-cell.empty:hover{background:var(--accent-lt);border-color:var(--accent)}
.pg-cell.filled{background:var(--accent-lt);border:1px solid var(--accent);color:var(--accent);font-weight:500;cursor:pointer}
.pg-cell.filled:hover{background:var(--accent);color:#fff}
.pg-cell.matched{background:var(--accent);color:#fff}
.pg-cell.dimmed{opacity:.2}
.items-table tr.row-highlight td{background:var(--accent-lt);transition:background 1.5s ease}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="wordmark">❄ <span class="accent">SyPhy</span>-lab</div>
    <div id="tabs-scroll"></div>
    <div class="topbar-right">
      <div id="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="search-input" type="search" placeholder="Search…" autocomplete="off">
      </div>
      <button class="icon-btn" id="btn-lowstock" title="Show low-stock items only">⚠</button>
      <button class="icon-btn" id="btn-settings" title="Settings">⚙</button>
      <button class="icon-btn" id="btn-theme" title="Toggle theme">◑</button>
    </div>
  </div>
  <div id="crumbbar"></div>
  <div id="main"></div>
</div>
<div id="toast"></div>

<script>
'use strict';

/* ══════════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════════ */
const S = {
  url:         localStorage.getItem('inv_url') || 'https://script.google.com/macros/s/AKfycbxBEOpcAIVvRBbwT1waR2YRBLQ0MCXBKSRGLhHnYCqNRn7mNMxYFJuU5udLkA8bdKlncA/exec',
  sheets:      [],
  activeSheet: localStorage.getItem('inv_sheet') || '',
  data:        null,
  cache:       {},
  activeBox:   null,   // null = grid view, string = box name
  search:      '',
  volFormRow:  null,   // sheet row number of open inline vol form
  filterLow:   false,
  lowVol: (() => {
    try { return JSON.parse(localStorage.getItem('inv_lowvol')) || {enabled:false,minConc:10,minVol:5}; }
    catch { return {enabled:false,minConc:10,minVol:5}; }
  })()
};

/* ══════════════════════════════════════════════════════════════
   JSONP HELPER
══════════════════════════════════════════════════════════════ */
let _seq = 0;
let _pendingSeq = null;  // target well index for next "Add Item" (set by clicking a cell)
/* ── Batch ID helper ───────────────────────────────────────────── */
function makeBatchId() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length:6}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
}

let _lnpPickerMode = (new URLSearchParams(location.search).get('mode') === 'lnp-picker');
let _highlightItemName = new URLSearchParams(location.search).get('highlight') || '';
let _highlightDone = false;

/* ── Archive / History ── */
let _archive = [];
try { _archive = JSON.parse(localStorage.getItem('inv_archive') || '[]'); } catch(e) {}
function saveArchive() { try { localStorage.setItem('inv_archive', JSON.stringify(_archive)); } catch(e) {} }
let _showingArchive = false;

// Load archive from the Google Sheet's __Archive__ tab (cross-device sync)
async function loadArchiveFromSheet() {
  if (!S.url) return;
  try {
    const res = await apiFetch({ action: 'getArchive' });
    if (!res.success || !res.items) return;
    let changed = false;
    res.items.forEach(si => {
      if (!_archive.find(a => a.item._archRow === si._archRow)) {
        _archive.push({
          item: { ...si, _row: si._archRow },   // _row = _archRow for button/virtual-box compatibility
          box: si.originalBox || '',
          sheet: si.originalSheet || '',
          archivedAt: (si.archivedAt || '').slice(0, 10)
        });
        changed = true;
      }
    });
    if (changed) { saveArchive(); if (_showingArchive) renderArchivePanel(); }
  } catch(e) { /* local-only archive still works */ }
}

async function archiveItem(row) {
  const box  = findBox(S.activeBox, S.data);
  const item = box?.items.find(i => i._row === row);
  if (!item) return;
  if (!confirm(`Archive "${item.name}"?\n\nIt will be removed from this box (the slot becomes free) and stored in Archive / History. All info is kept and it can still be picked in protocol apps.`)) return;
  showLoading('Archiving…');
  try {
    const payload = { name: item.name, concentration: item.concentration || '', volume: item.volume || '',
      date: item.date || '', preparer: item.preparer || '', glycerol: item.glycerol || '',
      labcollector: item.labcollector || '', batchId: item.batchId || '', notes: item.notes || '' };
    const res = await apiFetch({ action: 'archiveItem', sheet: S.activeSheet, box: S.activeBox, row: item._row, data: JSON.stringify(payload) });
    if (res.error) throw new Error(res.error);
    const archRow = res.archRow || 0;
    const entry = {
      item: { ...item, _row: archRow, _archRow: archRow, _originalRow: item._row },
      box: S.activeBox || '', sheet: S.activeSheet || '',
      archivedAt: new Date().toISOString().slice(0, 10)
    };
    const idx = _archive.findIndex(a => a.item._originalRow === row && a.sheet === S.activeSheet);
    if (idx >= 0) _archive[idx] = entry; else _archive.push(entry);
    saveArchive();
    toast(`🗄️ "${item.name}" archived`);
    await loadSheet(S.activeSheet, true);
  } catch(e) { toast(`Archive failed: ${e.message}`, true); }
}

async function unarchiveItem(archRow) {
  const entry = _archive.find(a => a.item._row === archRow || a.item._archRow === archRow);
  if (!entry) return;
  if (!confirm(`Restore "${entry.item.name}" to ${entry.box}?\n\nIt will go back to its original slot. Volume will be cleared — update it after restoring.`)) return;
  showLoading('Restoring…');
  try {
    if (entry.item._archRow) {
      const delRes = await apiFetch({ action: 'removeFromArchive', archRow: entry.item._archRow });
      if (delRes.error) throw new Error(delRes.error);
    }
    const originalRow = entry.item._originalRow || entry.item._row;
    const merged = { name: entry.item.name, concentration: entry.item.concentration || '', volume: '',
      date: entry.item.date || '', preparer: entry.item.preparer || '', glycerol: entry.item.glycerol || '',
      labcollector: entry.item.labcollector || '', batchId: entry.item.batchId || '' };
    const res = await apiFetch({ action: 'updateItem', sheet: entry.sheet || S.activeSheet, box: entry.box, row: originalRow, data: JSON.stringify(merged) });
    if (res.error) throw new Error(res.error);
    _archive = _archive.filter(a => a !== entry);
    saveArchive();
    toast(`✅ "${entry.item.name}" restored to ${entry.box}`);
    S.activeSheet = entry.sheet || S.activeSheet;
    await loadSheet(S.activeSheet, true);
  } catch(e) { toast(`Restore failed: ${e.message}`, true); }
}

/* ── Well-position helpers ── */
function seqToPos(seq) {
  const rows = ['A','B','C','D','E','F','G','H','I'];
  if (seq == null || seq < 0 || seq > 80) return '?';
  return rows[Math.floor(seq / 9)] + (seq % 9 + 1);
}
function posToSeq(posStr) {
  const rows = ['A','B','C','D','E','F','G','H','I'];
  const m = (posStr || '').trim().toUpperCase().match(/^([A-I])([1-9])$/);
  if (!m) return -1;
  return rows.indexOf(m[1]) * 9 + (parseInt(m[2]) - 1);
}

function apiFetch(params, ms = 18000) {
  return new Promise((resolve, reject) => {
    const cb = '_ic' + (++_seq);
    const sid = '_s' + cb;
    let done = false;
    const timer = setTimeout(() => { cleanup(); if (!done) reject(new Error('Request timed out')); }, ms);
    function cleanup() { delete window[cb]; const el = document.getElementById(sid); if (el) el.remove(); }
    window[cb] = data => { done = true; clearTimeout(timer); cleanup(); resolve(data); };
    const qs = Object.entries({ ...params, callback: cb })
      .map(([k,v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
    const sc = document.createElement('script');
    sc.id = sid;
    sc.src = S.url + '?' + qs;
    sc.onerror = () => { done = true; clearTimeout(timer); cleanup(); reject(new Error('Network / CORS error')); };
    document.head.appendChild(sc);
  });
}

/* ══════════════════════════════════════════════════════════════
   BOX UTILITIES
══════════════════════════════════════════════════════════════ */
function buildBoxSet(data) {
  const s = new Set();
  if (!data) return s;
  (data.boxes||[]).forEach(b => s.add(b.name.trim().toLowerCase()));
  return s;
}
function isBoxCell(val, boxSet) {
  if (!val || !val.trim()) return false;
  return boxSet.has(val.trim().toLowerCase()) || /^box\s*\d+$/i.test(val.trim());
}
function findBox(name, data) {
  if (!name || !data) return null;
  return (data.boxes||[]).find(b => b.name.trim().toLowerCase() === name.trim().toLowerCase()) || null;
}

/* ══════════════════════════════════════════════════════════════
   SEARCH
══════════════════════════════════════════════════════════════ */
function itemText(item) {
  return [item.name, item.labcollector, item.preparer, item.notes].filter(Boolean).join(' ').toLowerCase();
}
function matchQ(item, q) { return !q || itemText(item).includes(q.toLowerCase()); }

function getCrossResults(q) {
  if (!q) return { otherBoxes: [], otherSheets: [] };
  const otherBoxes = [], otherSheets = [];
  if (S.data) {
    (S.data.boxes||[]).forEach(box => {
      if (box.name === S.activeBox) return;
      if (box.items.some(it => matchQ(it, q))) otherBoxes.push(box.name);
    });
  }
  Object.entries(S.cache).forEach(([sheet, data]) => {
    if (sheet === S.activeSheet) return;
    (data.boxes||[]).forEach(box => {
      if (box.items.some(it => matchQ(it, q)))
        otherSheets.push({ sheet, box: box.name });
    });
  });
  return { otherBoxes, otherSheets };
}

function boxMatchMap(q) {
  // Returns {boxNameLower: count} for cross-box highlighting on grid
  const m = {};
  if (!q || !S.data) return m;
  (S.data.boxes||[]).forEach(box => {
    const cnt = box.items.filter(it => matchQ(it, q)).length;
    if (cnt) m[box.name.trim().toLowerCase()] = cnt;
  });
  return m;
}

/* ══════════════════════════════════════════════════════════════
   LOW VOLUME
══════════════════════════════════════════════════════════════ */
function isLowVol(item) {
  if (!S.lowVol.enabled) return false;
  const c = parseFloat(item.concentration);
  const v = parseFloat(item.volume);
  return !isNaN(c) && !isNaN(v) && c < S.lowVol.minConc && v < S.lowVol.minVol;
}

/* ══════════════════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════════════════ */
let _toastTimer;
function toast(msg, dur = 2800) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), dur);
}

/* ══════════════════════════════════════════════════════════════
   ESCAPE
══════════════════════════════════════════════════════════════ */
function h(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ══════════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════════ */
async function init() {
  const th = localStorage.getItem('inv_theme');
  if (th) document.documentElement.dataset.theme = th;

  if (!S.url) {
    const u = prompt('Enter your Google Apps Script web app URL:');
    if (!u || !u.startsWith('http')) { showMainErr('No URL. Reload and try again.'); return; }
    S.url = u.trim();
    localStorage.setItem('inv_url', S.url);
  }

  showLoading('Connecting…');
  try {
    const res = await apiFetch({ action: 'getSheets' });
    if (res.error) throw new Error(res.error);
    S.sheets = res.sheets || [];
    if (!S.sheets.find(s => s.name === S.activeSheet))
      S.activeSheet = S.sheets[0]?.name || '';
    renderTabs();
    await loadSheet(S.activeSheet);
    loadArchiveFromSheet(); // background sync — populates _archive from __Archive__ sheet tab
    // Signal the calculator that inventory is ready to receive deductions
    if (window.opener) window.opener.postMessage({ type: 'inv-ready' }, '*');
    // URL ?highlight=BATCHID_or_NAME — navigate to the box containing the item and flash its row
    if (_highlightItemName && S.data && !_highlightDone) {
      const lc = _highlightItemName.trim().toLowerCase();
      let found = null, foundBox = null;
      // Search by batchId first (exact, case-insensitive)
      for (const b of (S.data.boxes || [])) {
        const it = (b.items || []).find(i => i.batchId && i.batchId.toLowerCase() === lc);
        if (it) { found = it; foundBox = b.name; break; }
      }
      // Fallback: search by name
      if (!found) {
        for (const b of (S.data.boxes || [])) {
          const it = (b.items || []).find(i => i.name && i.name.trim().toLowerCase() === lc);
          if (it) { found = it; foundBox = b.name; break; }
        }
      }
      if (found) {
        _highlightDone = true;
        S.activeBox = foundBox;
        render();
        setTimeout(() => scrollToItem(found._row), 200);
      } else {
        // Item is archived — show Archive panel and highlight there
        const archEntry = _archive.find(a =>
          (a.item.batchId && a.item.batchId.toLowerCase() === lc) ||
          (a.item.name && a.item.name.trim().toLowerCase() === lc)
        );
        if (archEntry) {
          _highlightDone = true;
          _showingArchive = true;
          render();
          setTimeout(() => {
            const tr = document.querySelector(`#items-list tr[data-row="${archEntry.item._row}"]`);
            if (tr) { tr.scrollIntoView({ behavior:'smooth', block:'center' }); tr.style.outline='2px solid #0891b2'; setTimeout(()=>tr.style.outline='',2500); }
          }, 200);
        }
      }
    }
  } catch(e) { showMainErr('Connection failed: ' + e.message); }
}

async function loadSheet(name, force = false) {
  if (!name) return;
  S.activeSheet = name;
  S.activeBox   = null;
  S.volFormRow  = null;
  localStorage.setItem('inv_sheet', name);
  renderTabs();
  renderCrumb();

  if (!force && S.cache[name]) {
    S.data = S.cache[name];
    render();
    return;
  }

  showLoading('Loading ' + name + '…');
  try {
    const res = await apiFetch({ action: 'getData', sheet: name });
    if (res.error) throw new Error(res.error);
    S.data = res;
    S.cache[name] = res;
    render();
  } catch(e) { showMainErr('Load failed: ' + e.message); }
}

async function refreshCurrent() {
  const box = S.activeBox;
  await loadSheet(S.activeSheet, true);
  if (box && findBox(box, S.data)) {
    S.activeBox = box;
    render();
  }
}

/* ══════════════════════════════════════════════════════════════
   RENDER FRAME
══════════════════════════════════════════════════════════════ */
function showLoading(msg) {
  document.getElementById('main').innerHTML =
    `<div class="loading-wrap"><div class="spinner"></div>${h(msg)}</div>`;
}
function showMainErr(msg) {
  document.getElementById('main').innerHTML =
    `<div class="err-banner">⚠ ${h(msg)}</div>`;
}
function renderTabs() {
  document.getElementById('tabs-scroll').innerHTML =
    S.sheets.map(s =>
      `<button class="tab-btn${s.name===S.activeSheet?' active':''}" onclick="loadSheet('${h(s.name)}')">${h(s.name)}</button>`
    ).join('');
}
function renderCrumb() {
  const parts = [];
  if (S.activeSheet) {
    parts.push(`<span class="crumb${S.activeBox?' link':' current'}" onclick="showGrid()">${h(S.activeSheet)}</span>`);
  }
  if (S.activeBox) {
    parts.push('<span class="crumb-sep">›</span>');
    parts.push(`<span class="crumb current">${h(S.activeBox)}</span>`);
    parts.push('<div class="crumbbar-right"><button class="back-btn" onclick="showGrid()">← Grid</button></div>');
  }
  document.getElementById('crumbbar').innerHTML = parts.join('');
}
function render() {
  renderTabs();
  renderCrumb();
  if (_showingArchive) renderArchivePanel();
  else if (S.activeBox) renderBoxPanel();
  else renderGrid();
}

/* ══════════════════════════════════════════════════════════════
   GRID VIEW
══════════════════════════════════════════════════════════════ */
function showGrid() { S.activeBox = null; S.volFormRow = null; _showingArchive = false; render(); }

function renderGrid() {
  if (!S.data) return;
  const boxes  = S.data.boxes || [];
  const q      = S.search.trim();
  const bmMap  = boxMatchMap(q);
  const cross  = getCrossResults(q);

  let html = '';

  // Cross-sheet/box chips
  if (q && (cross.otherBoxes.length || cross.otherSheets.length)) {
    html += '<div class="cross-banner"><span class="cross-banner-label">Also found in:</span>';
    cross.otherBoxes.forEach(b => {
      html += `<button class="cross-chip" onclick="navigateBox('${h(b)}')">`
            + `<span class="rdot"></span>${h(b)}</button>`;
    });
    cross.otherSheets.forEach(r => {
      html += `<button class="cross-chip" onclick="jumpToSheet('${h(r.sheet)}','${h(r.box)}')">`
            + `<span class="rdot"></span>${h(r.sheet)}: ${h(r.box)}</button>`;
    });
    html += '</div>';
  }

  html += '<div class="grid-wrap">';
  html += `<div class="grid-header">
    <h2>📦 ${h(S.activeSheet)}</h2>
    <button class="btn-add-box" onclick="openAddBoxModal()">+ New Box</button>
  </div>`;

  if (boxes.length === 0) {
    html += `<div class="empty-state"><h3>No boxes yet</h3><p>Click <strong>+ New Box</strong> to create your first freezer box.</p></div>`;
    html += '</div>';
    document.getElementById('main').innerHTML = html;
    return;
  }

  html += '<div class="box-cards">';
  boxes.forEach(box => {
    const filledItems = box.items.filter(i => i.name);
    const count = filledItems.length;
    const hasMatch = q && bmMap[box.name.trim().toLowerCase()];
    const badge = hasMatch ? `<span class="box-card-badge">${bmMap[box.name.trim().toLowerCase()]}</span>` : '';
    const bColor = getBoxColor(S.activeSheet, box.name);
    const bStyle = bColor ? ` style="border-left:4px solid ${bColor}"` : '';
    const bBtnAttr = bColor ? ` data-colored style="background:${bColor}"` : '';
    html += `<div class="box-card"${bStyle} onclick="navigateBox('${h(box.name)}')">
      <button class="box-color-btn"${bBtnAttr} onclick="toggleColorPop(event,'${h(box.name)}')" title="Set box colour"></button>
      <div class="box-card-icon">🧊</div>
      <div class="box-card-name">${h(box.name)}${badge}</div>
      <div class="box-card-count">${count} / 81 positions filled</div>
    </div>`;
  });
  // Archive card
  const archCount = _archive.filter(a => a.sheet === S.activeSheet || !a.sheet).length;
  html += `<div class="box-card" style="border-left:4px solid #6b7280;opacity:.8;" onclick="_showingArchive=true;render()">
    <div class="box-card-icon">🗄️</div>
    <div class="box-card-name">Archive / History</div>
    <div class="box-card-count">${archCount} archived item${archCount !== 1 ? 's' : ''}</div>
  </div>`;
  html += '</div>'; // box-cards
  html += '</div>'; // grid-wrap
  document.getElementById('main').innerHTML = html;
}

/* ══════════════════════════════════════════════════════════════
   ARCHIVE PANEL
══════════════════════════════════════════════════════════════ */
function renderArchivePanel() {
  // All archived items for this sheet (or sheet-less entries)
  const entries = _archive.filter(a => !a.sheet || a.sheet === S.activeSheet || !S.activeSheet);
  const isPickerMode = _lnpPickerMode || !!window.opener;

  let html = `<div class="box-panel-header">
    <h2>🗄️ Archive / History</h2>
    <button class="back-btn" onclick="showGrid()">← Grid</button>
  </div>`;

  if (entries.length === 0) {
    html += `<div class="empty-state"><h3>No archived items</h3>
      <p>When a plasmid or LNP runs out, click <strong>🗄️ Archive</strong> on it to move it here.</p></div>`;
    document.getElementById('main').innerHTML = html;
    return;
  }

  if (isPickerMode) {
    html += `<div style="background:rgba(6,182,212,.1);border:1px solid rgba(6,182,212,.3);border-radius:8px;padding:.6rem 1rem;font-size:13px;margin-bottom:.8rem;color:#0891b2;">
      📜 These items are depleted but their records are intact. You can still pick them to link to a protocol.
    </div>`;
  }

  html += `<table class="items-table" id="items-list">
    <thead><tr>
      <th>Name</th><th>Was in box</th><th>Archived</th>
      <th>Conc (ng/µL)</th><th>Old volume (µL)</th><th>Date made</th><th>Preparer</th><th>Notes</th>
      <th>Actions</th>
    </tr></thead><tbody>`;

  entries.forEach(entry => {
    const it   = entry.item;
    const rrow = it._row;
    const archPickBtn = _lnpPickerMode
      ? `<button class="btn-pick" onclick="sendLnpToMice(${rrow})" title="Pick this depleted item">→ Use</button>`
      : (window.opener ? `<button class="btn-pick" onclick="sendToCalculator(${rrow})" title="Pick this depleted item">→ Send</button>` : '');
    const note    = it.notes || '';
    const snippet = note.length > 50 ? note.slice(0, 48) + '…' : note;
    html += `<tr data-row="${rrow}" style="opacity:.85;">
      <td><span class="name-cell" style="color:var(--text2)">⛔ ${h(it.name||'—')}</span></td>
      <td><span style="font-size:11px;background:var(--surface2);border-radius:4px;padding:.1rem .4rem;">🧊 ${h(entry.box||'—')}</span></td>
      <td style="font-size:11px;color:var(--text3);">${h(entry.archivedAt||'—')}</td>
      <td class="mono" style="color:var(--text2);">${h(it.concentration||'—')}</td>
      <td class="mono" style="color:var(--text3);text-decoration:line-through;">${h(it.volume||'—')}</td>
      <td class="mono">${h(it.date||'—')}</td>
      <td>${h(it.preparer||'—')}</td>
      <td style="max-width:160px;font-size:12px;color:var(--text2);" title="${h(note)}">${h(snippet)||'—'}</td>
      <td><div class="row-actions">
        ${archPickBtn}
        <button class="btn-edit" onclick="unarchiveItem(${rrow})" title="Restore to active inventory" style="font-size:11px;">↩ Restore</button>
      </div></td>
    </tr>`;
  });

  html += '</tbody></table>';

  document.getElementById('main').innerHTML = html;

  // Wire up sendToCalculator / sendLnpToMice for archived items (they need the full item data available)
  if (window.opener || _lnpPickerMode) {
    // Temporarily inject archived items into a virtual box so sendToCalculator/sendLnpToMice can find them
    entries.forEach(entry => {
      if (!S.data) return;
      const vBox = findBox('__archive__', S.data);
      if (!vBox) {
        S.data.boxes = S.data.boxes || [];
        S.data.boxes.push({ name: '__archive__', items: [] });
      }
      const vb = findBox('__archive__', S.data);
      if (!vb.items.find(i => i._row === entry.item._row)) vb.items.push({ ...entry.item });
    });
    // Temporarily set activeBox to __archive__ for picker sends
    document.getElementById('items-list')?.querySelectorAll('[onclick*="sendLnpToMice"],[onclick*="sendToCalculator"]').forEach(btn => {
      btn.onclick = null;
      const row = parseInt(btn.closest('tr')?.getAttribute('data-row'));
      if (!row) return;
      if (_lnpPickerMode) btn.onclick = () => { const prevBox = S.activeBox; S.activeBox = '__archive__'; sendLnpToMice(row); S.activeBox = prevBox; };
      else btn.onclick = () => { const prevBox = S.activeBox; S.activeBox = '__archive__'; sendToCalculator(row); S.activeBox = prevBox; };
    });
  }
}

/* ══════════════════════════════════════════════════════════════
   BOX PANEL VIEW
══════════════════════════════════════════════════════════════ */
async function navigateBox(name) {
  const box = findBox(name, S.data);
  if (box) {
    S.activeBox = box.name;
    S.volFormRow = null;
    render();
  } else {
    if (!confirm(`"${name}" has no item list yet.\nCreate it now in the sheet?`)) return;
    showLoading('Creating box…');
    try {
      const res = await apiFetch({ action: 'addBox', sheet: S.activeSheet, boxName: name });
      if (res.error) throw new Error(res.error);
      await loadSheet(S.activeSheet, true);
      const b = findBox(name, S.data);
      if (b) { S.activeBox = b.name; render(); }
      toast(`Box "${name}" created ✓`);
    } catch(e) { showMainErr('Create failed: ' + e.message); }
  }
}

async function jumpToSheet(sheet, box) {
  await loadSheet(sheet, false);
  await navigateBox(box);
}

function renderBoxPanel() {
  if (!S.data) return;
  const box  = findBox(S.activeBox, S.data);
  const q    = S.search.trim();
  const cross = getCrossResults(q);

  let html = '';

  // Cross chips
  if (q && (cross.otherBoxes.length || cross.otherSheets.length)) {
    html += '<div class="cross-banner"><span class="cross-banner-label">Also in:</span>';
    cross.otherBoxes.forEach(b => {
      html += `<button class="cross-chip" onclick="navigateBox('${h(b)}')">`
            + `<span class="rdot"></span>${h(b)}</button>`;
    });
    cross.otherSheets.forEach(r => {
      html += `<button class="cross-chip" onclick="jumpToSheet('${h(r.sheet)}','${h(r.box)}')">`
            + `<span class="rdot"></span>${h(r.sheet)}: ${h(r.box)}</button>`;
    });
    html += '</div>';
  }

  html += '<div class="box-panel-header">';
  html += `<h2>📋 ${h(S.activeBox)}</h2>`;
  html += `<button class="btn-add-item" onclick="openAddItemModal()">+ Add Item</button>`;
  html += '</div>';

  // ── Physical plate grid (9×9) reconstructed from _seq ────────
  if (box) {
    // Build a 9×9 map: seq index → item
    const bySeq = {};
    box.items.forEach(item => {
      if (item._seq !== undefined) bySeq[item._seq] = item;
    });

    html += '<div class="plate-wrap">';
    html += '<div class="plate-title">Physical plate layout</div>';
    html += '<div class="plate-grid">';
    // Corner + column headers
    html += '<div class="pg-corner"></div>';
    for (let c = 1; c <= 9; c++) html += `<div class="pg-col">${c}</div>`;
    // Rows A-I
    const rowLabels = ['A','B','C','D','E','F','G','H','I'];
    for (let ri = 0; ri < 9; ri++) {
      html += `<div class="pg-row">${rowLabels[ri]}</div>`;
      for (let ci = 0; ci < 9; ci++) {
        const seq  = ri * 9 + ci;
        const item = bySeq[seq];
        if (!item || !item.name) {
          // Empty cell — clicking it adds to this specific position
          html += `<div class="pg-cell empty" onclick="openAddItemModal(${seq})" title="${seqToPos(seq)} — empty, click to add here"></div>`;
        } else {
          const matches = matchQ(item, q);
          const dim     = q && !matches;
          const cls     = dim ? 'pg-cell filled dimmed' : (q && matches ? 'pg-cell filled matched' : 'pg-cell filled');
          const label   = item.name.length > 20 ? item.name.slice(0,18)+'…' : item.name;
          html += `<div class="${cls}" onclick="scrollToItem(${item._row})" title="${h(item.name)}">${h(label)}</div>`;
        }
      }
    }
    html += '</div></div>'; // plate-grid, plate-wrap
  }

  const allItems       = box ? box.items.filter(i => i.name) : [];
  const hasItems       = allItems.length > 0;
  const visibleItems   = S.filterLow ? allItems.filter(i => isLowVol(i)) : allItems;

  if (!box || !hasItems) {
    html += `<div class="empty-state">
      <h3>No items in "${h(S.activeBox)}"</h3>
      <p>Click <strong>+ Add Item</strong> to add your first plasmid.</p>
    </div>`;
    document.getElementById('main').innerHTML = html;
    return;
  }

  if (S.filterLow && visibleItems.length === 0) {
    html += `<div class="empty-state"><h3>No low-stock items ✓</h3><p>All items are above your thresholds.</p></div>`;
    document.getElementById('main').innerHTML = html;
    return;
  }

  // Show columns if box declares them OR any item already has data for them
  const showLC   = box.hasLabCollector !== false;
  const showConc = box.hasConc !== false || allItems.some(i => i.concentration != null && i.concentration !== '');
  const showVol  = box.hasVolume !== false || allItems.some(i => i.volume != null && i.volume !== '');
  const showPrep = box.hasPreparer !== false || allItems.some(i => i.preparer);
  const showGly  = box.hasGlycerol !== false || allItems.some(i => i.glycerol);
  const showNote = allItems.some(i => i.notes);

  html += '<table class="items-table" id="items-list"><thead><tr>';
  html += '<th>Name</th>';
  if (showLC)   html += '<th>LabCollector</th>';
  if (showConc) html += '<th>Conc <span style="text-transform:none">(ng/µL)</span></th>';
  if (showVol)  html += '<th>Volume <span style="text-transform:none">(µL)</span></th>';
  html += '<th>Date</th>';
  if (showPrep) html += '<th>Preparer</th>';
  if (showGly)  html += '<th>Glycerol stock</th>';
  if (showNote) html += '<th>Notes</th>';
  html += '<th>Actions</th></tr></thead><tbody>';

  visibleItems.forEach(item => {
    const matches = matchQ(item, q);
    const low     = isLowVol(item);
    const rowCls  = (q && !matches) ? 'dimmed' : '';
    html += `<tr class="${rowCls}" data-row="${item._row}">`;
    html += `<td><span class="name-cell">${h(item.name)}</span>${low ? ' <span class="low-badge">⚠ low</span>' : ''}${item.batchId ? ` <code style="font-size:9.5px;color:var(--text3);font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;" title="Batch ID — used to link this item across mice, transfection calculator and lenti protocol">#${h(item.batchId)}</code>` : ''}</td>`;

    if (showLC) {
      const lc = item.labcollector || '';
      html += '<td>' + (lc
        ? `<a class="lc-link" href="https://bs-labcollect01.ethz.ch/moor/plasmids.php?search=1&strict=on&by_id=${h(lc)}" target="_blank" rel="noopener">${h(lc)} ↗</a>`
        : '<span style="color:var(--text3)">—</span>') + '</td>';
    }

    if (showConc) html += `<td class="mono">${h(item.concentration||'—')}</td>`;

    if (showVol) {
      const vStr = item.volume != null && item.volume !== '' ? item.volume : '';
      if (S.volFormRow === item._row) {
        html += `<td><div class="vol-form">
          <input type="number" id="vfi" min="0" step="0.1" placeholder="used µL"
            onkeydown="if(event.key==='Enter')applyVol(${item._row});if(event.key==='Escape')cancelVol()">
          <button class="apply" onclick="applyVol(${item._row})">✓</button>
          <button class="cancel" onclick="cancelVol()">✕</button>
        </div></td>`;
      } else {
        html += `<td><div class="vol-wrap">
          <span class="vol-num">${h(vStr)||'—'}</span>
          <button class="use-vol-btn" onclick="openVolForm(${item._row})">Use…</button>
        </div></td>`;
      }
    }

    html += `<td class="mono">${h(item.date||'—')}</td>`;
    if (showPrep) html += `<td>${h(item.preparer||'—')}</td>`;
    if (showGly)  html += `<td>${h(item.glycerol||'—')}</td>`;
    if (showNote) {
      const note    = item.notes || '';
      const snippet = note.length > 60 ? note.slice(0, 57) + '…' : note;
      html += `<td style="max-width:180px;white-space:pre-wrap;font-size:12px;color:var(--text2)" title="${h(note)}">${h(snippet)||'<span style="color:var(--text3)">—</span>'}</td>`;
    }
    const pickBtn = _lnpPickerMode
      ? `<button class="btn-pick" onclick="sendLnpToMice(${item._row})">→ Use</button>`
      : (window.opener ? `<button class="btn-pick" onclick="sendToCalculator(${item._row})">→ Send</button>` : '');
    html += `<td><div class="row-actions">
      ${pickBtn}
      <button class="btn-edit" onclick="openEditModal(${item._row})">Edit</button>
      <button class="btn-del" onclick="doDelete(${item._row})" style="color:var(--danger)">Delete</button>
      <button class="btn-del" onclick="archiveItem(${item._row})" title="Archive — frees the box slot, stores record in Archive / History" style="color:var(--text3);font-size:11px;">🗄️ Archive</button>
    </div></td>`;
    html += '</tr>';
  });

  html += '</tbody></table>';

  document.getElementById('main').innerHTML = html;

  if (S.volFormRow !== null) {
    setTimeout(() => document.getElementById('vfi')?.focus(), 40);
  }
}

/* ── Volume inline form ─────────────────────────────────────── */
function openVolForm(row) { S.volFormRow = row; renderBoxPanel(); }
function cancelVol()      { S.volFormRow = null; renderBoxPanel(); }

/* ── Scroll to item row in the list table ───────────────────── */
function scrollToItem(row) {
  const tr = document.querySelector(`#items-list tr[data-row="${row}"]`);
  if (!tr) return;
  tr.scrollIntoView({ behavior: 'smooth', block: 'center' });
  tr.classList.add('row-highlight');
  setTimeout(() => tr.classList.remove('row-highlight'), 2000);
}

async function applyVol(row) {
  const inp = document.getElementById('vfi');
  if (!inp) return;
  const used = parseFloat(inp.value);
  if (isNaN(used) || used < 0) { inp.style.borderColor='var(--danger)'; inp.focus(); return; }
  try {
    const res = await apiFetch({
      action:'useVolume', sheet:S.activeSheet, box:S.activeBox, row, used
    });
    if (res.error) throw new Error(res.error);
    toast(`Used ${used} µL → ${res.newVolume} µL remaining`);
    S.volFormRow = null;
    await refreshCurrent();
  } catch(e) { toast('Error: ' + e.message, 5000); }
}

function openModal(html) {

}
function closeModal() {
  document.getElementById('modal-overlay')?.remove();
}
function modalErr(msg) {

/* ── Box colour tags ──────────────────────────────────────── */
const BOX_PALETTE = ['#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6','#ec4899','#64748b'];
function getBoxColors(){try{return JSON.parse(localStorage.getItem('inv_box_colors')||'{}');}catch(e){return {};}}
function getBoxColor(s,b){return getBoxColors()[(s||'')+'::'+b]||'';}
function setBoxColor(s,b,c){const a=getBoxColors();const k=(s||'')+'::'+b;if(c)a[k]=c;else delete a[k];try{localStorage.setItem('inv_box_colors',JSON.stringify(a));}catch(e){}}
let _cpOpen=null;
function toggleColorPop(e, boxName) {
  e.stopPropagation();
  const old = document.getElementById('box-color-pop');
  if (old) { old.remove(); if (_cpOpen === boxName) { _cpOpen = null; return; } }
  _cpOpen = boxName;
  const btn = e.currentTarget;
  const rect = btn.getBoundingClientRect();
  const cur = getBoxColor(S.activeSheet, boxName);
  const pop = document.createElement('div');
  pop.id = 'box-color-pop'; pop.className = 'box-color-pop';
  pop.style.top  = (rect.bottom + 4) + 'px';
  pop.style.left = Math.max(8, rect.right - 130) + 'px';
  const ns = document.createElement('div');
  ns.className = 'color-sw color-sw-none' + (!cur ? ' selected' : '');
  ns.title = 'Remove colour'; ns.textContent = '✕';
  ns.onclick = ev => { ev.stopPropagation(); setBoxColor(S.activeSheet, boxName, ''); render(); pop.remove(); _cpOpen=null; };
  pop.appendChild(ns);
  BOX_PALETTE.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-sw' + (cur === c ? ' selected' : '');
    sw.style.background = c; sw.title = c;
    sw.onclick = ev => { ev.stopPropagation(); setBoxColor(S.activeSheet, boxName, c); render(); pop.remove(); _cpOpen=null; };
    pop.appendChild(sw);
  });
  document.body.appendChild(pop);
  const dismiss = ev => { if (!pop.contains(ev.target) && ev.target !== btn) { pop.remove(); _cpOpen=null; document.removeEventListener('click', dismiss, true); } };
  setTimeout(() => document.addEventListener('click', dismiss, true), 50);
}

    <div class="modal-bd">
      <div id="modal-err-wrap"></div>

        <div class="frow"><label>Volume (µL)</label><input class="finput" id="mi-vol" type="number" step="0.1" min="0" placeholder="50"></div>
      </div>
      <div class="frow"><label>Glycerol stock</label><input class="finput" id="mi-glycerol" placeholder="e.g. yes / -80°C box 3" autocomplete="off"></div>
      <div class="frow"><label>Notes</label><textarea class="finput" id="mi-notes" rows="2" placeholder="Any extra details — insert size, backbone, resistance…" style="resize:vertical"></textarea></div>
    </div>

    </div>
  </div>`);

      const pf = _prefillData;
      _prefillData = null;
      if (pf.name)  { const el = document.getElementById('mi-name'); if (el) { el.value = pf.name; el.style.borderColor='var(--accent)'; setTimeout(()=>el.style.borderColor='',1500); } }
      if (pf.conc)  { const el = document.getElementById('mi-conc'); if (el) el.value = pf.conc; }
      if (pf.volume){ const el = document.getElementById('mi-vol');  if (el) el.value = pf.volume; }
    }
  }, 50);
}

async function submitAddItem() {
  const name    = document.getElementById('mi-name').value.trim();
  const lab     = (document.getElementById('mi-lab')?.value     || '').trim();
  const date    = document.getElementById('mi-date').value;
  const glycerol= (document.getElementById('mi-glycerol')?.value|| '').trim();
  const conc    = (document.getElementById('mi-conc')?.value    || '').trim();
  const vol     = (document.getElementById('mi-vol')?.value     || '').trim();
  const prep    = (document.getElementById('mi-prep')?.value    || '').trim();
  const notes   = (document.getElementById('mi-notes')?.value   || '').trim();
  if (!name) { modalErr('Name is required.'); return; }
  if (!date) { modalErr('Date is required.'); return; }

  // Resolve target well position
  let targetSeq = _pendingSeq;
  const posInput = document.getElementById('mi-pos');
  if (posInput) {
    const parsed = posToSeq(posInput.value);
    if (parsed < 0) { modalErr('Invalid position — use format A1 to I9.'); return; }
    targetSeq = parsed;
  }

  // Occupancy check
  if (targetSeq !== null && targetSeq >= 0) {
    const box = findBox(S.activeBox, S.data);
    const occupied = box?.items.find(i => i._seq === targetSeq && i.name);
    if (occupied) {
      modalErr(`Position ${seqToPos(targetSeq)} is already occupied by "${occupied.name}". Choose a different well.`);
      return;
    }
  }

  try {
    const itemData = { name, labcollector:lab, date, glycerol, concentration:conc, volume:vol, preparer:prep, notes, batchId: makeBatchId() };
    if (targetSeq !== null && targetSeq >= 0) itemData._seq = targetSeq;
    const res = await apiFetch({
      action: 'addItem', sheet: S.activeSheet, box: S.activeBox,
      data: JSON.stringify(itemData)
    });
    if (res.error) throw new Error(res.error);
    _pendingSeq = null;
    closeModal();
    toast('Item added ✓');
    await refreshCurrent();
  } catch(e) { modalErr(e.message); }
}

      </div>

    </div>
    <div class="modal-ft">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="submitEdit(${row})">Save</button>

async function submitEdit(row) {
  const name    = document.getElementById('mi-name').value.trim();
  const lab     = (document.getElementById('mi-lab')?.value     || '').trim();
  const date    = document.getElementById('mi-date').value;
  const glycerol= (document.getElementById('mi-glycerol')?.value|| '').trim();
  const conc    = (document.getElementById('mi-conc')?.value    || '').trim();
  const vol     = (document.getElementById('mi-vol')?.value     || '').trim();
  const prep    = (document.getElementById('mi-prep')?.value    || '').trim();
  const notes   = (document.getElementById('mi-notes')?.value   || '').trim();
  if (!name) { modalErr('Name is required.'); return; }

  // Resolve position change
  const box = findBox(S.activeBox, S.data);
  const item = box?.items.find(i => i._row === row);
  const posInput = (document.getElementById('mi-pos')?.value || '').trim();
  let newSeq = item?._seq ?? null;

  if (posInput) {
    const parsed = posToSeq(posInput);
    if (parsed < 0) { modalErr('Invalid position — use format A1 to I9.'); return; }
    if (parsed !== newSeq) {
      // Check occupancy by another item
      const occupant = box?.items.find(i => i._seq === parsed && i._row !== row && i.name);
      if (occupant) {
        modalErr(`Position ${seqToPos(parsed)} is already occupied by "${occupant.name}". Choose a different well.`);
        return;
      }
      newSeq = parsed;
    }
  }

  try {
    const itemData = { name, labcollector:lab, date, glycerol, concentration:conc, volume:vol, preparer:prep, notes, batchId: item?.batchId || '' };
    if (newSeq !== null) itemData._seq = newSeq;
    const res = await apiFetch({
      action: 'updateItem', sheet: S.activeSheet, box: S.activeBox, row,
      data: JSON.stringify(itemData)
    });
    if (res.error) throw new Error(res.error);
    closeModal();
    toast('Saved ✓');
    await refreshCurrent();
  } catch(e) { modalErr(e.message); }
}

    if (res.error) throw new Error(res.error);
    toast('Deleted');
    await refreshCurrent();
  } catch(e) { toast('Error: ' + e.message, 5000); }
}

        <input class="finput" id="gv" value="${h(val)}" autocomplete="off"></div>
    </div>
    <div class="modal-ft">
      <button class="btn-danger2" onclick="submitGridCell(${ri},${ci},'')">Clear</button>
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="submitGridCell(${ri},${ci})">Save</button>
    </div>
  </div>`);
  setTimeout(() => { const el = document.getElementById('gv'); el?.focus(); el?.select(); }, 40);
}

async function submitGridCell(ri, ci, forceVal) {
  const val = forceVal !== undefined ? forceVal : (document.getElementById('gv')?.value?.trim() ?? '');
  if (forceVal === '' && !confirm('Clear this cell?')) return;
  try {
    const res = await apiFetch({ action:'updateGrid', sheet:S.activeSheet, gridRow:ri, gridCol:ci, value:val });
    if (res.error) throw new Error(res.error);
    closeModal();
    toast(val ? 'Label saved ✓' : 'Cell cleared');
    await loadSheet(S.activeSheet, true);
    render();
  } catch(e) { modalErr(e.message); }
}

/* ── Add Box ───────────────────────────────────────────────── */
function openAddBoxModal() {
  openModal(`<div class="modal">
    <div class="modal-hd"><h3>Create New Box</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-bd">
      <div id="modal-err-wrap"></div>
      <div class="frow req"><label>Box name</label>
        <input class="finput" id="bn" placeholder="e.g. Box 5, AAV Box" autocomplete="off">
        <div class="fhint">Adds header rows to your Google Sheet.</div></div>
    </div>
    <div class="modal-ft">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="submitAddBox()">Create</button>
    </div>
  </div>`);
  setTimeout(() => document.getElementById('bn')?.focus(), 40);
}

async function submitAddBox() {
  const name = document.getElementById('bn')?.value?.trim();
  if (!name) { modalErr('Name is required.'); return; }
  try {
    const res = await apiFetch({ action:'addBox', sheet:S.activeSheet, boxName:name });
    if (res.error) throw new Error(res.error);
    closeModal();
    toast(`Box "${name}" created ✓`);
    await loadSheet(S.activeSheet, true);
    render();
  } catch(e) { modalErr(e.message); }
}

/* ── Settings ──────────────────────────────────────────────── */
function openSettings() {
  const isDark = document.documentElement.dataset.theme === 'dark';
  openModal(`<div class="modal wide">
    <div class="modal-hd"><h3>⚙ Settings</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-bd">
      <div class="settings-section">
        <h4>Connection</h4>
        <div class="frow"><label>Apps Script URL</label>
          <input class="finput" id="s-url" value="${h(S.url)}" style="font-size:11px;font-family:'IBM Plex Mono',monospace">
          <div class="fhint">Deploy → Web app (Execute as Me, Anyone can access)</div></div>
        <button class="btn-primary" style="width:100%;margin-top:8px" onclick="saveUrl()">Update URL &amp; Reconnect</button>
      </div>
      <div class="settings-section">
        <h4>Low Volume Warning</h4>
        <div class="toggle-row">
          <span class="toggle-lbl">Enable warning</span>
          <label class="toggle"><input type="checkbox" id="s-lv" ${S.lowVol.enabled?'checked':''}><span class="toggle-slider"></span></label>
        </div>
        <p style="font-size:12px;color:var(--text2);margin-bottom:10px">Warn when <em>both</em> concentration AND volume are below thresholds.</p>
        <div class="fgrid2">
          <div class="frow"><label>Conc threshold (ng/µL)</label><input class="finput" id="s-mc" type="number" step="1" min="0" value="${S.lowVol.minConc}"></div>
          <div class="frow"><label>Volume threshold (µL)</label><input class="finput" id="s-mv" type="number" step="1" min="0" value="${S.lowVol.minVol}"></div>
        </div>
      </div>
      <div class="settings-section">
        <h4>Appearance</h4>
        <div class="toggle-row">
          <span class="toggle-lbl">Dark mode</span>
          <label class="toggle"><input type="checkbox" id="s-dk" ${isDark?'checked':''} onchange="setTheme(this.checked)"><span class="toggle-slider"></span></label>
        </div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn-secondary" onclick="closeModal()">Close</button>
      <button class="btn-primary" onclick="saveSettings()">Save</button>
    </div>
  </div>`);
}

function saveUrl() {
  const u = document.getElementById('s-url')?.value?.trim();
  if (!u) return;
  S.url = u; localStorage.setItem('inv_url', u);
  S.cache = {}; S.data = null;
  closeModal(); init();
}

function saveSettings() {
  S.lowVol.enabled = !!document.getElementById('s-lv')?.checked;
  S.lowVol.minConc = parseFloat(document.getElementById('s-mc')?.value) || 10;
  S.lowVol.minVol  = parseFloat(document.getElementById('s-mv')?.value) || 5;
  localStorage.setItem('inv_lowvol', JSON.stringify(S.lowVol));
  closeModal(); toast('Settings saved'); render();
}

function setTheme(dark) {
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  localStorage.setItem('inv_theme', dark ? 'dark' : 'light');
}

/* ══════════════════════════════════════════════════════════════
   EVENT LISTENERS
══════════════════════════════════════════════════════════════ */
document.getElementById('search-input').addEventListener('input', e => {
  S.search = e.target.value; render();
});
document.getElementById('btn-lowstock').addEventListener('click', () => {
  S.filterLow = !S.filterLow;
  document.getElementById('btn-lowstock').classList.toggle('filter-active', S.filterLow);
  render();
});
document.getElementById('btn-settings').addEventListener('click', openSettings);
document.getElementById('btn-theme').addEventListener('click', () => {
  const isDark = document.documentElement.dataset.theme === 'dark'
    || (!document.documentElement.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
  setTheme(!isDark);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ══════════════════════════════════════════════════════════════
   CALCULATOR PICKER MODE
══════════════════════════════════════════════════════════════ */
function sendToCalculator(row) {
  const box  = findBox(S.activeBox, S.data);
  const item = box?.items.find(i => i._row === row);
  if (!item || !window.opener) return;
  window.opener.postMessage({
    type:    'plasmid-pick',
    name:    item.name          || '',
    conc:    item.concentration || '',
    volume:  item.volume        || '',
    batchId: item.batchId       || '',
    _row:    item._row,
    box:     S.activeBox        || '',
    sheet:   S.activeSheet      || '',
    invUrl:  S.url              || ''
  }, '*');
  window.close();
}

if (window.opener) {
  // Running as a popup — show a banner (LNP picker or plasmid picker)
  document.addEventListener('DOMContentLoaded', () => {
    const banner = document.createElement('div');
    banner.className = 'picker-banner';
    if (_lnpPickerMode) {
      banner.style.background = '#059669';
      banner.innerHTML = '🧪 LNP picker — navigate to a box, then click <strong>→ Use</strong> next to an LNP item to link it to the mice sheet &nbsp;<button onclick="window.close()" style="background:rgba(255,255,255,.2);border:none;border-radius:5px;color:#fff;font-size:12px;padding:.2rem .6rem;cursor:pointer;float:right;">✕ Cancel</button>';
    } else {
      banner.textContent = '📦 Stock picker mode — navigate to a box, then click → Send next to a plasmid to load it into the calculator';
    }
    const app = document.getElementById('app');
    if (app) app.insertBefore(banner, app.firstChild);
  });
}

function sendLnpToMice(row) {
  const box  = findBox(S.activeBox, S.data);
  const item = box?.items.find(i => i._row === row);
  if (!item || !window.opener) return;
  window.opener.postMessage({
    type:  'lnp-pick',
    item:  {
      _row:          item._row,
      name:          item.name          || '',
      batchId:       item.batchId       || '',
      concentration: item.concentration || '',
      volume:        item.volume        || '',
      date:          item.date          || '',
      preparer:      item.preparer      || '',
      notes:         item.notes         || '',
      labcollector:  item.labcollector  || ''
    },
    box:   { name: S.activeBox || '' },
    sheet: S.activeSheet || ''
  }, '*');
  window.close();
}

/* ══════════════════════════════════════════════════════════════
   VOLUME DEDUCTION (triggered by transfection calculator)
══════════════════════════════════════════════════════════════ */
window.addEventListener('message', async function(e) {
  if (!e.data) return;

  // ── Pre-fill Add Item form (from lenti-protocol "Record in inventory") ──
  if (e.data.type === 'prefill-add') {
    _prefillData = e.data;
    // If a box is already selected, open the modal immediately
    if (S.activeBox) {
      openAddItemModal();
    } else {
      toast('📋 Pre-fill ready — select a box then click + Add Item');
    }
    return;
  }

  if (e.data.type !== 'deduct-volumes') return;
  const deductions = e.data.deductions;
  if (!Array.isArray(deductions) || deductions.length === 0) return;

  let done = 0, failed = 0;
  for (const d of deductions) {
    const usedRounded = Math.round(d.used * 100) / 100;
    try {
      const res = await apiFetch({
        action: 'useVolume',
        sheet:  d.sheet,
        box:    d.box,
        row:    d.row,
        used:   usedRounded
      });
      if (res.error) throw new Error(res.error);
      done++;
    } catch(err) {
      console.error('useVolume failed for', d.name, err);
      failed++;
    }
  }

  if (failed === 0) {
    alert(`✅ Stock updated: ${done} plasmid${done !== 1 ? 's' : ''} deducted successfully.`);
  } else {
    alert(`⚠️ ${done} updated, ${failed} failed. Check the console for details.`);
  }
  window.close();
});

/* ══════════════════════════════════════════════════════════════
   START
══════════════════════════════════════════════════════════════ */
init();
</script>
