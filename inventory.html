<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freezer Inventory · SyPhy-lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ── Design tokens ─────────────────────────────────────────────── */
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface2: #f0f2f5;
  --surface3: #e8eaed;
  --border: #dde1e7;
  --text: #1c1e26;
  --text2: #6b7280;
  --text3: #9ca3af;
  --accent: #2563eb;
  --accent-lt: #dbeafe;
  --accent-dark: #1d4ed8;
  --box-bg: #fffbeb;
  --box-border: #d97706;
  --box-text: #92400e;
  --danger: #dc2626;
  --danger-lt: #fee2e2;
  --success: #16a34a;
  --warn: #d97706;
  --warn-lt: #fef3c7;
  --rad: 8px;
  --rad-sm: 5px;
  --shadow: 0 1px 3px rgba(0,0,0,.1);
  --shadow-lg: 0 8px 30px rgba(0,0,0,.15);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0d0f14;--surface:#161920;--surface2:#1e2129;--surface3:#272b35;
  --border:#2a2f3d;--text:#e4e6eb;--text2:#8b949e;--text3:#6e7681;
  --accent:#5b9bd5;--accent-lt:#162035;--accent-dark:#4a8fc7;
  --box-bg:#1f1a0a;--box-border:#b45309;--box-text:#fbbf24;
  --danger:#f87171;--danger-lt:#2d1515;--success:#4ade80;--warn:#fbbf24;--warn-lt:#292008;
}}
:root[data-theme="dark"] {
  --bg:#0d0f14;--surface:#161920;--surface2:#1e2129;--surface3:#272b35;
  --border:#2a2f3d;--text:#e4e6eb;--text2:#8b949e;--text3:#6e7681;
  --accent:#5b9bd5;--accent-lt:#162035;--accent-dark:#4a8fc7;
  --box-bg:#1f1a0a;--box-border:#b45309;--box-text:#fbbf24;
  --danger:#f87171;--danger-lt:#2d1515;--success:#4ade80;--warn:#fbbf24;--warn-lt:#292008;
}
:root[data-theme="light"] {
  --bg:#f4f5f7;--surface:#ffffff;--surface2:#f0f2f5;--surface3:#e8eaed;
  --border:#dde1e7;--text:#1c1e26;--text2:#6b7280;--text3:#9ca3af;
  --accent:#2563eb;--accent-lt:#dbeafe;--accent-dark:#1d4ed8;
  --box-bg:#fffbeb;--box-border:#d97706;--box-text:#92400e;
  --danger:#dc2626;--danger-lt:#fee2e2;--success:#16a34a;--warn:#d97706;--warn-lt:#fef3c7;
}

/* ── Reset & base ──────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font-family:inherit;font-size:inherit}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

/* ── Layout ────────────────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── Top bar ───────────────────────────────────────────────────── */
#topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 16px;display:flex;align-items:center;gap:10px;
  min-height:52px;flex-shrink:0;box-shadow:var(--shadow);position:relative;z-index:10;
}
#wordmark{font-weight:600;font-size:15px;white-space:nowrap;color:var(--text);display:flex;align-items:center;gap:6px;flex-shrink:0}
#wordmark .accent{color:var(--accent)}
#tabs-scroll{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
#tabs-scroll::-webkit-scrollbar{display:none}
.tab-btn{
  padding:5px 14px;border:none;background:transparent;
  color:var(--text2);cursor:pointer;border-radius:var(--rad-sm);
  font-size:13px;font-weight:500;white-space:nowrap;
  transition:background .15s,color .15s;flex-shrink:0;
}
.tab-btn:hover{background:var(--surface2);color:var(--text)}
.tab-btn.active{background:var(--accent-lt);color:var(--accent);font-weight:600}
.topbar-right{display:flex;gap:6px;align-items:center;flex-shrink:0}
#search-wrap{position:relative}
#search-input{
  width:210px;padding:6px 10px 6px 30px;
  border:1px solid var(--border);border-radius:var(--rad);
  background:var(--surface2);color:var(--text);font-size:13px;
  transition:border-color .15s;
}
#search-input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
.icon-btn{
  width:34px;height:34px;border:1px solid var(--border);border-radius:var(--rad);
  background:var(--surface);color:var(--text2);cursor:pointer;
  font-size:15px;display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--surface2);color:var(--text)}

/* ── Breadcrumb bar ─────────────────────────────────────────────── */
#crumbbar{
  background:var(--surface2);border-bottom:1px solid var(--border);
  padding:6px 16px;display:flex;align-items:center;gap:8px;
  flex-shrink:0;min-height:38px;
}
.crumb{font-size:13px;color:var(--text2)}
.crumb.link{cursor:pointer;color:var(--accent)}
.crumb.link:hover{text-decoration:underline}
.crumb.current{color:var(--text);font-weight:500}
.crumb-sep{color:var(--text3);font-size:12px}
.crumbbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.back-btn{
  padding:3px 10px;border:1px solid var(--border);border-radius:var(--rad-sm);
  background:var(--surface);color:var(--text);cursor:pointer;font-size:12px;
}
.back-btn:hover{background:var(--surface3)}

/* ── Main scroll area ──────────────────────────────────────────── */
#main{flex:1;overflow-y:auto;padding:20px 16px 40px}

/* ── Grid view ──────────────────────────────────────────────────── */
.grid-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.grid-header h2{font-size:17px;font-weight:600}
.btn-add-box{
  padding:6px 14px;background:var(--accent);color:#fff;
  border:none;border-radius:var(--rad);cursor:pointer;
  font-size:13px;font-weight:500;
}
.btn-add-box:hover{background:var(--accent-dark)}

/* Cross-results banner */
.cross-banner{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);
  padding:8px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
}
.cross-banner-label{font-size:12px;color:var(--text2);font-weight:500}
.cross-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:20px;
  border:1px solid var(--danger);background:transparent;
  color:var(--danger);cursor:pointer;font-size:12px;
  transition:background .15s,color .15s;
}
.cross-chip:hover{background:var(--danger);color:#fff}
.rdot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}

/* Grid table */
.grid-wrap{max-width:860px}
.grid-table{display:grid;grid-template-columns:22px repeat(9,1fr);gap:3px}
.gc-corner,.gc-col-label{
  font-size:10px;color:var(--text3);font-family:'IBM Plex Mono',monospace;
  text-align:center;padding:2px;display:flex;align-items:center;justify-content:center;
}
.gc-row-label{
  font-size:10px;color:var(--text3);font-family:'IBM Plex Mono',monospace;
  display:flex;align-items:center;justify-content:center;
}
.gc{
  aspect-ratio:1;border-radius:var(--rad-sm);border:1px solid var(--border);
  background:var(--surface);cursor:pointer;
  font-family:'IBM Plex Mono',monospace;font-size:8.5px;line-height:1.2;
  padding:4px 3px;text-align:center;
  display:flex;align-items:center;justify-content:center;
  word-break:break-word;hyphens:auto;overflow:hidden;
  transition:opacity .2s,border-color .15s,background .15s;
  position:relative;
}
.gc:hover{border-color:var(--accent);background:var(--accent-lt)}
.gc.empty{color:var(--text3)}
.gc.empty:hover::after{content:'+';font-size:18px;color:var(--accent);font-family:'IBM Plex Sans',sans-serif;position:absolute}
.gc.empty:hover span{opacity:0}
.gc.box-cell{background:var(--box-bg);border-color:var(--box-border);color:var(--box-text);font-weight:700;font-size:9.5px}
.gc.box-cell:hover{background:var(--box-border);color:#fff}
.gc.item-cell{background:var(--surface2);color:var(--text)}
.gc.item-cell:hover{background:var(--accent-lt);border-color:var(--accent)}
.gc.dimmed{opacity:.28;pointer-events:none}
.gc .badge-dot{position:absolute;top:2px;left:2px;width:7px;height:7px;border-radius:50%;background:var(--danger)}

/* ── Box panel ──────────────────────────────────────────────────── */
.box-panel-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.box-panel-header h2{font-size:17px;font-weight:600}
.btn-add-item{
  padding:6px 14px;background:var(--accent);color:#fff;
  border:none;border-radius:var(--rad);cursor:pointer;
  font-size:13px;font-weight:500;margin-left:auto;
}
.btn-add-item:hover{background:var(--accent-dark)}

.items-table{width:100%;border-collapse:collapse}
.items-table th{
  text-align:left;padding:8px 10px;font-size:11px;font-weight:600;color:var(--text2);
  border-bottom:2px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;
}
.items-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13px}
.items-table tr:last-child td{border-bottom:none}
.items-table tr.dimmed td{opacity:.35}
.name-cell{font-weight:500}
.lc-link{color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:11.5px}
.mono{font-family:'IBM Plex Mono',monospace;font-size:12px}

/* Volume */
.vol-wrap{display:flex;align-items:center;gap:6px}
.vol-num{font-family:'IBM Plex Mono',monospace;font-size:12px;min-width:44px}
.low-badge{
  font-size:10px;background:var(--warn-lt);color:var(--warn);
  padding:1px 5px;border-radius:3px;border:1px solid var(--warn);white-space:nowrap;
}
.use-vol-btn{
  padding:2px 8px;border:1px solid var(--border);border-radius:4px;
  background:transparent;color:var(--text2);cursor:pointer;font-size:11px;
}
.use-vol-btn:hover{border-color:var(--accent);color:var(--accent)}
.vol-form{display:inline-flex;align-items:center;gap:4px}
.vol-form input{
  width:70px;padding:2px 6px;border:1px solid var(--accent);border-radius:4px;
  background:var(--surface);color:var(--text);
  font-family:'IBM Plex Mono',monospace;font-size:12px;
}
.vol-form .apply{padding:2px 8px;border:none;background:var(--accent);color:#fff;border-radius:4px;cursor:pointer;font-size:11px}
.vol-form .apply:hover{background:var(--accent-dark)}
.vol-form .cancel{padding:2px 6px;border:1px solid var(--border);background:transparent;color:var(--text2);border-radius:4px;cursor:pointer;font-size:11px}

/* Row actions */
.row-actions{display:flex;gap:5px}
.btn-edit,.btn-del{padding:3px 9px;border-radius:4px;cursor:pointer;font-size:12px;border:1px solid;transition:background .12s,color .12s}
.btn-edit{border-color:var(--border);background:transparent;color:var(--text2)}
.btn-edit:hover{border-color:var(--accent);color:var(--accent)}
.btn-del{border-color:var(--danger);background:transparent;color:var(--danger)}
.btn-del:hover{background:var(--danger);color:#fff}

/* Empty state */
.empty-state{text-align:center;padding:52px 16px;color:var(--text2)}
.empty-state h3{font-size:16px;margin-bottom:6px;color:var(--text)}

/* ── Modals ─────────────────────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;
}
.modal{
  background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);
  width:100%;max-width:460px;max-height:92vh;overflow-y:auto;
}
.modal.wide{max-width:540px}
.modal-hd{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:var(--surface);z-index:1;
}
.modal-hd h3{font-size:16px;font-weight:600}
.modal-x{
  width:28px;height:28px;border:none;border-radius:50%;
  background:var(--surface2);color:var(--text2);cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;
}
.modal-x:hover{background:var(--surface3);color:var(--text)}
.modal-bd{padding:20px}
.modal-ft{
  padding:14px 20px;border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:8px;
  position:sticky;bottom:0;background:var(--surface);
}
.modal-err-wrap{margin-bottom:12px}
.modal-err{background:var(--danger-lt);color:var(--danger);padding:9px 13px;border-radius:var(--rad-sm);font-size:13px}

/* Forms */
.frow{margin-bottom:13px}
.frow.req label::after{content:' *';color:var(--danger)}
.frow label{display:block;font-size:11.5px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.finput{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--rad);
  background:var(--surface2);color:var(--text);font-size:14px;
}
.finput:focus{outline:2px solid var(--accent);border-color:transparent}
.fhint{font-size:11px;color:var(--text3);margin-top:3px}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Buttons */
.btn-primary{padding:8px 18px;background:var(--accent);color:#fff;border:none;border-radius:var(--rad);cursor:pointer;font-size:14px;font-weight:500}
.btn-primary:hover{background:var(--accent-dark)}
.btn-secondary{padding:8px 16px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:var(--rad);cursor:pointer;font-size:14px}
.btn-secondary:hover{background:var(--surface2)}
.btn-danger2{padding:8px 16px;background:transparent;color:var(--danger);border:1px solid var(--danger);border-radius:var(--rad);cursor:pointer;font-size:14px}
.btn-danger2:hover{background:var(--danger);color:#fff}

/* Settings */
.settings-section{margin-bottom:22px}
.settings-section:last-child{margin-bottom:0}
.settings-section h4{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.toggle-lbl{font-size:14px}
.toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:11px;cursor:pointer;transition:background .2s}
.toggle-slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle input:checked~.toggle-slider{background:var(--accent)}
.toggle input:checked~.toggle-slider::before{transform:translateX(18px)}

/* Loading / error */
.loading-wrap{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--text2);gap:10px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err-banner{background:var(--danger-lt);color:var(--danger);padding:12px 16px;border-radius:var(--rad);margin-bottom:14px;font-size:13px}

/* Toast */
#toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--text);color:var(--bg);padding:9px 18px;border-radius:20px;
  font-size:13px;z-index:2000;transition:transform .3s;
  pointer-events:none;white-space:nowrap;box-shadow:var(--shadow-lg);
}
#toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:600px){
  #search-input{width:140px}
  .gc{font-size:7px}
}

/* ── Box cards (freezer overview) ──────────────────────────── */
.box-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;padding:6px 0}
.box-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);padding:18px 16px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.box-card:hover{border-color:var(--accent);box-shadow:var(--shadow-lg)}
.box-card-icon{font-size:26px;margin-bottom:8px}
.box-card-name{font-weight:600;font-size:15px;margin-bottom:4px;color:var(--text)}
.box-card-count{font-size:13px;color:var(--text2)}
.box-card-badge{display:inline-block;background:var(--accent);color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 7px;margin-left:6px;vertical-align:middle}

/* ── Plate grid (box physical layout) ─────────────────────── */
.plate-wrap{margin-bottom:20px}
.plate-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.plate-grid{display:grid;grid-template-columns:26px repeat(9,1fr);gap:3px;overflow-x:auto}
.pg-corner{width:26px}
.pg-col{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--text3);height:22px}
.pg-row{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--text3);height:50px;width:26px}
.pg-cell{height:50px;border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:2px 3px;font-size:9px;text-align:center;word-break:break-all;line-height:1.2;transition:all .15s}
.pg-cell.empty{background:var(--surface2);border:1px dashed var(--border);cursor:pointer}
.pg-cell.empty:hover{background:var(--accent-lt);border-color:var(--accent)}
.pg-cell.filled{background:var(--accent-lt);border:1px solid var(--accent);color:var(--accent);font-weight:500;cursor:pointer}
.pg-cell.filled:hover{background:var(--accent);color:#fff}
.pg-cell.matched{background:var(--accent);color:#fff}
.pg-cell.dimmed{opacity:.2}
.items-table tr.row-highlight td{background:var(--accent-lt);transition:background 1.5s ease}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="wordmark">❄ <span class="accent">SyPhy</span>-lab</div>
    <div id="tabs-scroll"></div>
    <div class="topbar-right">
      <div id="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="search-input" type="search" placeholder="Search…" autocomplete="off">
      </div>
      <button class="icon-btn" id="btn-settings" title="Settings">⚙</button>
      <button class="icon-btn" id="btn-theme" title="Toggle theme">◑</button>
    </div>
  </div>
  <div id="crumbbar"></div>
  <div id="main"></div>
</div>
<div id="toast"></div>

<script>
'use strict';

/* ══════════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════════ */
const S = {
  url:         localStorage.getItem('inv_url') || 'https://script.google.com/macros/s/AKfycbwnZAfMHfrQuOjdugx9w0AHMVoc6qZQlnM8OZx5VzZ4r5PTJMOabNmB0gmbRsVH9ripbw/exec',
  sheets:      [],
  activeSheet: localStorage.getItem('inv_sheet') || '',
  data:        null,
  cache:       {},
  activeBox:   null,   // null = grid view, string = box name
  search:      '',
  volFormRow:  null,   // sheet row number of open inline vol form
  lowVol: (() => {
    try { return JSON.parse(localStorage.getItem('inv_lowvol')) || {enabled:false,minConc:10,minVol:5}; }
    catch { return {enabled:false,minConc:10,minVol:5}; }
  })()
};

/* ══════════════════════════════════════════════════════════════
   JSONP HELPER
══════════════════════════════════════════════════════════════ */
let _seq = 0;
function apiFetch(params, ms = 18000) {
  return new Promise((resolve, reject) => {
    const cb = '_ic' + (++_seq);
    const sid = '_s' + cb;
    let done = false;
    const timer = setTimeout(() => { cleanup(); if (!done) reject(new Error('Request timed out')); }, ms);
    function cleanup() { delete window[cb]; const el = document.getElementById(sid); if (el) el.remove(); }
    window[cb] = data => { done = true; clearTimeout(timer); cleanup(); resolve(data); };
    const qs = Object.entries({ ...params, callback: cb })
      .map(([k,v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
    const sc = document.createElement('script');
    sc.id = sid;
    sc.src = S.url + '?' + qs;
    sc.onerror = () => { done = true; clearTimeout(timer); cleanup(); reject(new Error('Network / CORS error')); };
    document.head.appendChild(sc);
  });
}

/* ══════════════════════════════════════════════════════════════
   BOX UTILITIES
══════════════════════════════════════════════════════════════ */
function buildBoxSet(data) {
  const s = new Set();
  if (!data) return s;
  (data.boxes||[]).forEach(b => s.add(b.name.trim().toLowerCase()));
  return s;
}
function isBoxCell(val, boxSet) {
  if (!val || !val.trim()) return false;
  return boxSet.has(val.trim().toLowerCase()) || /^box\s*\d+$/i.test(val.trim());
}
function findBox(name, data) {
  if (!name || !data) return null;
  return (data.boxes||[]).find(b => b.name.trim().toLowerCase() === name.trim().toLowerCase()) || null;
}

/* ══════════════════════════════════════════════════════════════
   SEARCH
══════════════════════════════════════════════════════════════ */
function itemText(item) {
  return [item.name, item.labcollector, item.preparer].filter(Boolean).join(' ').toLowerCase();
}
function matchQ(item, q) { return !q || itemText(item).includes(q.toLowerCase()); }

function getCrossResults(q) {
  if (!q) return { otherBoxes: [], otherSheets: [] };
  const otherBoxes = [], otherSheets = [];
  if (S.data) {
    (S.data.boxes||[]).forEach(box => {
      if (box.name === S.activeBox) return;
      if (box.items.some(it => matchQ(it, q))) otherBoxes.push(box.name);
    });
  }
  Object.entries(S.cache).forEach(([sheet, data]) => {
    if (sheet === S.activeSheet) return;
    (data.boxes||[]).forEach(box => {
      if (box.items.some(it => matchQ(it, q)))
        otherSheets.push({ sheet, box: box.name });
    });
  });
  return { otherBoxes, otherSheets };
}

function boxMatchMap(q) {
  // Returns {boxNameLower: count} for cross-box highlighting on grid
  const m = {};
  if (!q || !S.data) return m;
  (S.data.boxes||[]).forEach(box => {
    const cnt = box.items.filter(it => matchQ(it, q)).length;
    if (cnt) m[box.name.trim().toLowerCase()] = cnt;
  });
  return m;
}

/* ══════════════════════════════════════════════════════════════
   LOW VOLUME
══════════════════════════════════════════════════════════════ */
function isLowVol(item) {
  if (!S.lowVol.enabled) return false;
  const c = parseFloat(item.concentration);
  const v = parseFloat(item.volume);
  return !isNaN(c) && !isNaN(v) && c < S.lowVol.minConc && v < S.lowVol.minVol;
}

/* ══════════════════════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════════════════════ */
let _toastTimer;
function toast(msg, dur = 2800) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), dur);
}

/* ══════════════════════════════════════════════════════════════
   ESCAPE
══════════════════════════════════════════════════════════════ */
function h(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ══════════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════════ */
async function init() {
  const th = localStorage.getItem('inv_theme');
  if (th) document.documentElement.dataset.theme = th;

  if (!S.url) {
    const u = prompt('Enter your Google Apps Script web app URL:');
    if (!u || !u.startsWith('http')) { showMainErr('No URL. Reload and try again.'); return; }
    S.url = u.trim();
    localStorage.setItem('inv_url', S.url);
  }

  showLoading('Connecting…');
  try {
    const res = await apiFetch({ action: 'getSheets' });
    if (res.error) throw new Error(res.error);
    S.sheets = res.sheets || [];
    if (!S.sheets.find(s => s.name === S.activeSheet))
      S.activeSheet = S.sheets[0]?.name || '';
    renderTabs();
    await loadSheet(S.activeSheet);
  } catch(e) { showMainErr('Connection failed: ' + e.message); }
}

async function loadSheet(name, force = false) {
  if (!name) return;
  S.activeSheet = name;
  S.activeBox   = null;
  S.volFormRow  = null;
  localStorage.setItem('inv_sheet', name);
  renderTabs();
  renderCrumb();

  if (!force && S.cache[name]) {
    S.data = S.cache[name];
    render();
    return;
  }

  showLoading('Loading ' + name + '…');
  try {
    const res = await apiFetch({ action: 'getData', sheet: name });
    if (res.error) throw new Error(res.error);
    S.data = res;
    S.cache[name] = res;
    render();
  } catch(e) { showMainErr('Load failed: ' + e.message); }
}

async function refreshCurrent() {
  const box = S.activeBox;
  await loadSheet(S.activeSheet, true);
  if (box && findBox(box, S.data)) {
    S.activeBox = box;
    render();
  }
}

/* ══════════════════════════════════════════════════════════════
   RENDER FRAME
══════════════════════════════════════════════════════════════ */
function showLoading(msg) {
  document.getElementById('main').innerHTML =
    `<div class="loading-wrap"><div class="spinner"></div>${h(msg)}</div>`;
}
function showMainErr(msg) {
  document.getElementById('main').innerHTML =
    `<div class="err-banner">⚠ ${h(msg)}</div>`;
}
function renderTabs() {
  document.getElementById('tabs-scroll').innerHTML =
    S.sheets.map(s =>
      `<button class="tab-btn${s.name===S.activeSheet?' active':''}" onclick="loadSheet('${h(s.name)}')">${h(s.name)}</button>`
    ).join('');
}
function renderCrumb() {
  const parts = [];
  if (S.activeSheet) {
    parts.push(`<span class="crumb${S.activeBox?' link':' current'}" onclick="showGrid()">${h(S.activeSheet)}</span>`);
  }
  if (S.activeBox) {
    parts.push('<span class="crumb-sep">›</span>');
    parts.push(`<span class="crumb current">${h(S.activeBox)}</span>`);
    parts.push('<div class="crumbbar-right"><button class="back-btn" onclick="showGrid()">← Grid</button></div>');
  }
  document.getElementById('crumbbar').innerHTML = parts.join('');
}
function render() {
  renderTabs();
  renderCrumb();
  if (S.activeBox) renderBoxPanel();
  else renderGrid();
}

/* ══════════════════════════════════════════════════════════════
   GRID VIEW
══════════════════════════════════════════════════════════════ */
function showGrid() { S.activeBox = null; S.volFormRow = null; render(); }

function renderGrid() {
  if (!S.data) return;
  const boxes  = S.data.boxes || [];
  const q      = S.search.trim();
  const bmMap  = boxMatchMap(q);
  const cross  = getCrossResults(q);

  let html = '';

  // Cross-sheet/box chips
  if (q && (cross.otherBoxes.length || cross.otherSheets.length)) {
    html += '<div class="cross-banner"><span class="cross-banner-label">Also found in:</span>';
    cross.otherBoxes.forEach(b => {
      html += `<button class="cross-chip" onclick="navigateBox('${h(b)}')">`
            + `<span class="rdot"></span>${h(b)}</button>`;
    });
    cross.otherSheets.forEach(r => {
      html += `<button class="cross-chip" onclick="jumpToSheet('${h(r.sheet)}','${h(r.box)}')">`
            + `<span class="rdot"></span>${h(r.sheet)}: ${h(r.box)}</button>`;
    });
    html += '</div>';
  }

  html += '<div class="grid-wrap">';
  html += `<div class="grid-header">
    <h2>📦 ${h(S.activeSheet)}</h2>
    <button class="btn-add-box" onclick="openAddBoxModal()">+ New Box</button>
  </div>`;

  if (boxes.length === 0) {
    html += `<div class="empty-state"><h3>No boxes yet</h3><p>Click <strong>+ New Box</strong> to create your first freezer box.</p></div>`;
    html += '</div>';
    document.getElementById('main').innerHTML = html;
    return;
  }

  html += '<div class="box-cards">';
  boxes.forEach(box => {
    const filledItems = box.items.filter(i => i.name);
    const count = filledItems.length;
    const hasMatch = q && bmMap[box.name.trim().toLowerCase()];
    const badge = hasMatch ? `<span class="box-card-badge">${bmMap[box.name.trim().toLowerCase()]}</span>` : '';
    html += `<div class="box-card" onclick="navigateBox('${h(box.name)}')">
      <div class="box-card-icon">🧊</div>
      <div class="box-card-name">${h(box.name)}${badge}</div>
      <div class="box-card-count">${count} / 81 positions filled</div>
    </div>`;
  });
  html += '</div>'; // box-cards
  html += '</div>'; // grid-wrap
  document.getElementById('main').innerHTML = html;
}

/* ══════════════════════════════════════════════════════════════
   BOX PANEL VIEW
══════════════════════════════════════════════════════════════ */
async function navigateBox(name) {
  const box = findBox(name, S.data);
  if (box) {
    S.activeBox = box.name;
    S.volFormRow = null;
    render();
  } else {
    if (!confirm(`"${name}" has no item list yet.\nCreate it now in the sheet?`)) return;
    showLoading('Creating box…');
    try {
      const res = await apiFetch({ action: 'addBox', sheet: S.activeSheet, boxName: name });
      if (res.error) throw new Error(res.error);
      await loadSheet(S.activeSheet, true);
      const b = findBox(name, S.data);
      if (b) { S.activeBox = b.name; render(); }
      toast(`Box "${name}" created ✓`);
    } catch(e) { showMainErr('Create failed: ' + e.message); }
  }
}

async function jumpToSheet(sheet, box) {
  await loadSheet(sheet, false);
  await navigateBox(box);
}

function renderBoxPanel() {
  if (!S.data) return;
  const box  = findBox(S.activeBox, S.data);
  const q    = S.search.trim();
  const cross = getCrossResults(q);

  let html = '';

  // Cross chips
  if (q && (cross.otherBoxes.length || cross.otherSheets.length)) {
    html += '<div class="cross-banner"><span class="cross-banner-label">Also in:</span>';
    cross.otherBoxes.forEach(b => {
      html += `<button class="cross-chip" onclick="navigateBox('${h(b)}')">`
            + `<span class="rdot"></span>${h(b)}</button>`;
    });
    cross.otherSheets.forEach(r => {
      html += `<button class="cross-chip" onclick="jumpToSheet('${h(r.sheet)}','${h(r.box)}')">`
            + `<span class="rdot"></span>${h(r.sheet)}: ${h(r.box)}</button>`;
    });
    html += '</div>';
  }

  html += '<div class="box-panel-header">';
  html += `<h2>📋 ${h(S.activeBox)}</h2>`;
  html += `<button class="btn-add-item" onclick="openAddItemModal()">+ Add Item</button>`;
  html += '</div>';

  // ── Physical plate grid (9×9) reconstructed from _seq ────────
  if (box) {
    // Build a 9×9 map: seq index → item
    const bySeq = {};
    box.items.forEach(item => {
      if (item._seq !== undefined) bySeq[item._seq] = item;
    });

    html += '<div class="plate-wrap">';
    html += '<div class="plate-title">Physical plate layout</div>';
    html += '<div class="plate-grid">';
    // Corner + column headers
    html += '<div class="pg-corner"></div>';
    for (let c = 1; c <= 9; c++) html += `<div class="pg-col">${c}</div>`;
    // Rows A-I
    const rowLabels = ['A','B','C','D','E','F','G','H','I'];
    for (let ri = 0; ri < 9; ri++) {
      html += `<div class="pg-row">${rowLabels[ri]}</div>`;
      for (let ci = 0; ci < 9; ci++) {
        const seq  = ri * 9 + ci;
        const item = bySeq[seq];
        if (!item || !item.name) {
          // Empty cell — clicking it adds to this position
          html += `<div class="pg-cell empty" onclick="openAddItemModal()" title="Empty — click to add"></div>`;
        } else {
          const matches = matchQ(item, q);
          const dim     = q && !matches;
          const cls     = dim ? 'pg-cell filled dimmed' : (q && matches ? 'pg-cell filled matched' : 'pg-cell filled');
          const label   = item.name.length > 20 ? item.name.slice(0,18)+'…' : item.name;
          html += `<div class="${cls}" onclick="scrollToItem(${item._row})" title="${h(item.name)}">${h(label)}</div>`;
        }
      }
    }
    html += '</div></div>'; // plate-grid, plate-wrap
  }

  const hasItems = box && box.items.filter(i => i.name).length > 0;
  if (!box || !hasItems) {
    html += `<div class="empty-state">
      <h3>No items in "${h(S.activeBox)}"</h3>
      <p>Click <strong>+ Add Item</strong> to add your first plasmid.</p>
    </div>`;
    document.getElementById('main').innerHTML = html;
    return;
  }

  html += '<table class="items-table" id="items-list"><thead><tr>';
  html += '<th>Name</th>';
  if (box.hasLabCollector !== false) html += '<th>LabCollector</th>';
  if (box.hasConc !== false)         html += '<th>Conc (ng/µL)</th>';
  if (box.hasVolume !== false)       html += '<th>Volume (µL)</th>';
  html += '<th>Date</th>';
  if (box.hasPreparer !== false)     html += '<th>Preparer</th>';
  if (box.hasGlycerol !== false)     html += '<th>Glycerol stock</th>';
  html += '<th>Actions</th></tr></thead><tbody>';

  box.items.filter(i => i.name).forEach(item => {
    const matches = matchQ(item, q);
    const low     = isLowVol(item);
    const rowCls  = (q && !matches) ? 'dimmed' : '';
    html += `<tr class="${rowCls}" data-row="${item._row}">`;
    html += `<td><span class="name-cell">${h(item.name)}</span>${low ? ' <span class="low-badge">⚠ low</span>' : ''}</td>`;

    if (box.hasLabCollector !== false) {
      const lc = item.labcollector || '';
      html += '<td>' + (lc
        ? `<a class="lc-link" href="https://bs-labcollect01.ethz.ch/moor/plasmids.php?search=1&strict=on&by_id=${h(lc)}" target="_blank" rel="noopener">${h(lc)} ↗</a>`
        : '<span style="color:var(--text3)">—</span>') + '</td>';
    }

    if (box.hasConc !== false) html += `<td class="mono">${h(item.concentration||'—')}</td>`;

    if (box.hasVolume !== false) {
      const vStr = item.volume != null && item.volume !== '' ? item.volume : '';
      if (S.volFormRow === item._row) {
        html += `<td><div class="vol-form">
          <input type="number" id="vfi" min="0" step="0.1" placeholder="used µL"
            onkeydown="if(event.key==='Enter')applyVol(${item._row});if(event.key==='Escape')cancelVol()">
          <button class="apply" onclick="applyVol(${item._row})">✓</button>
          <button class="cancel" onclick="cancelVol()">✕</button>
        </div></td>`;
      } else {
        html += `<td><div class="vol-wrap">
          <span class="vol-num">${h(vStr)||'—'}</span>
          <button class="use-vol-btn" onclick="openVolForm(${item._row})">Use…</button>
        </div></td>`;
      }
    }

    html += `<td class="mono">${h(item.date||'—')}</td>`;
    if (box.hasPreparer !== false) html += `<td>${h(item.preparer||'—')}</td>`;
    if (box.hasGlycerol !== false) html += `<td>${h(item.glycerol||'—')}</td>`;
    html += `<td><div class="row-actions">
      <button class="btn-edit" onclick="openEditModal(${item._row})">Edit</button>
      <button class="btn-del" onclick="doDelete(${item._row})">Delete</button>
    </div></td>`;
    html += '</tr>';
  });

  html += '</tbody></table>';
  document.getElementById('main').innerHTML = html;

  if (S.volFormRow !== null) {
    setTimeout(() => document.getElementById('vfi')?.focus(), 40);
  }
}

/* ── Volume inline form ─────────────────────────────────────── */
function openVolForm(row) { S.volFormRow = row; renderBoxPanel(); }
function cancelVol()      { S.volFormRow = null; renderBoxPanel(); }

/* ── Scroll to item row in the list table ───────────────────── */
function scrollToItem(row) {
  const tr = document.querySelector(`#items-list tr[data-row="${row}"]`);
  if (!tr) return;
  tr.scrollIntoView({ behavior: 'smooth', block: 'center' });
  tr.classList.add('row-highlight');
  setTimeout(() => tr.classList.remove('row-highlight'), 2000);
}

async function applyVol(row) {
  const inp = document.getElementById('vfi');
  if (!inp) return;
  const used = parseFloat(inp.value);
  if (isNaN(used) || used < 0) { inp.style.borderColor='var(--danger)'; inp.focus(); return; }
  try {
    const res = await apiFetch({
      action:'useVolume', sheet:S.activeSheet, box:S.activeBox, row, used
    });
    if (res.error) throw new Error(res.error);
    toast(`Used ${used} µL → ${res.newVolume} µL remaining`);
    S.volFormRow = null;
    await refreshCurrent();
  } catch(e) { toast('Error: ' + e.message, 5000); }
}

/* ══════════════════════════════════════════════════════════════
   MODALS
══════════════════════════════════════════════════════════════ */
function openModal(html) {
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.id = 'modal-overlay';
  ov.innerHTML = html;
  ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
}
function closeModal() {
  document.getElementById('modal-overlay')?.remove();
}
function modalErr(msg) {
  const el = document.getElementById('modal-err-wrap');
  if (el) el.innerHTML = `<div class="modal-err">⚠ ${h(msg)}</div>`;
}

/* ── Add Item ──────────────────────────────────────────────── */
function openAddItemModal() {
  const box = findBox(S.activeBox, S.data);
  let extraFields = '';
  if (box?.hasGlycerol !== false) extraFields += `<div class="frow"><label>Glycerol stock</label><input class="finput" id="mi-glycerol" placeholder="e.g. yes / -80°C" autocomplete="off"></div>`;
  if (box?.hasConc !== false)     extraFields += `<div class="frow"><label>Concentration (ng/µL)</label><input class="finput" id="mi-conc" type="number" step="0.1" min="0" placeholder="500"></div>`;
  if (box?.hasVolume !== false)   extraFields += `<div class="frow"><label>Volume (µL)</label><input class="finput" id="mi-vol" type="number" step="0.1" min="0" placeholder="50"></div>`;
  if (box?.hasPreparer !== false) extraFields += `<div class="frow"><label>Preparer</label><input class="finput" id="mi-prep" placeholder="Your name" autocomplete="off"></div>`;

  openModal(`<div class="modal">
    <div class="modal-hd"><h3>Add Item — ${h(S.activeBox)}</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-bd">
      <div id="modal-err-wrap"></div>
      <div class="frow req"><label>Name</label><input class="finput" id="mi-name" placeholder="Plasmid / construct name" autocomplete="off"></div>
      <div class="frow"><label>LabCollector ID</label>
        <input class="finput" id="mi-lab" placeholder="e.g. 4521" autocomplete="off">
        <div class="fhint">Links to LabCollector plasmid record</div></div>
      <div class="frow req"><label>Date</label><input class="finput" id="mi-date" type="date"></div>
      ${extraFields}
    </div>
    <div class="modal-ft">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="submitAddItem()">Add Item</button>
    </div>
  </div>`);
  setTimeout(() => document.getElementById('mi-name')?.focus(), 40);
}

async function submitAddItem() {
  const name    = document.getElementById('mi-name').value.trim();
  const lab     = (document.getElementById('mi-lab')?.value     || '').trim();
  const date    = document.getElementById('mi-date').value;
  const glycerol= (document.getElementById('mi-glycerol')?.value|| '').trim();
  const conc    = (document.getElementById('mi-conc')?.value    || '').trim();
  const vol     = (document.getElementById('mi-vol')?.value     || '').trim();
  const prep    = (document.getElementById('mi-prep')?.value    || '').trim();
  if (!name) { modalErr('Name is required.'); return; }
  try {
    const res = await apiFetch({
      action: 'addItem', sheet: S.activeSheet, box: S.activeBox,
      data: JSON.stringify({ name, labcollector:lab, date, glycerol, concentration:conc, volume:vol, preparer:prep })
    });
    if (res.error) throw new Error(res.error);
    closeModal();
    toast('Item added ✓');
    await refreshCurrent();
  } catch(e) { modalErr(e.message); }
}

/* ── Edit Item ─────────────────────────────────────────────── */
function openEditModal(row) {
  const box  = findBox(S.activeBox, S.data);
  const item = box?.items.find(i => i._row === row);
  if (!item) return;
  let extraFields = '';
  if (box?.hasGlycerol !== false) extraFields += `<div class="frow"><label>Glycerol stock</label><input class="finput" id="mi-glycerol" value="${h(item.glycerol||'')}" autocomplete="off"></div>`;
  if (box?.hasConc !== false)     extraFields += `<div class="frow"><label>Concentration (ng/µL)</label><input class="finput" id="mi-conc" type="number" step="0.1" min="0" value="${h(item.concentration||'')}"></div>`;
  if (box?.hasVolume !== false)   extraFields += `<div class="frow"><label>Volume (µL)</label><input class="finput" id="mi-vol" type="number" step="0.1" min="0" value="${h(item.volume||'')}"></div>`;
  if (box?.hasPreparer !== false) extraFields += `<div class="frow"><label>Preparer</label><input class="finput" id="mi-prep" value="${h(item.preparer||'')}" autocomplete="off"></div>`;

  openModal(`<div class="modal">
    <div class="modal-hd"><h3>Edit Item</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-bd">
      <div id="modal-err-wrap"></div>
      <div class="frow req"><label>Name</label><input class="finput" id="mi-name" value="${h(item.name||'')}" autocomplete="off"></div>
      <div class="frow"><label>LabCollector ID</label><input class="finput" id="mi-lab" value="${h(item.labcollector||'')}" autocomplete="off"></div>
      <div class="frow req"><label>Date</label><input class="finput" id="mi-date" type="date" value="${h(item.date||'')}"></div>
      ${extraFields}
    </div>
    <div class="modal-ft">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="submitEdit(${row})">Save</button>
    </div>
  </div>`);
  setTimeout(() => document.getElementById('mi-name')?.focus(), 40);
}

async function submitEdit(row) {
  const name    = document.getElementById('mi-name').value.trim();
  const lab     = (document.getElementById('mi-lab')?.value     || '').trim();
  const date    = document.getElementById('mi-date').value;
  const glycerol= (document.getElementById('mi-glycerol')?.value|| '').trim();
  const conc    = (document.getElementById('mi-conc')?.value    || '').trim();
  const vol     = (document.getElementById('mi-vol')?.value     || '').trim();
  const prep    = (document.getElementById('mi-prep')?.value    || '').trim();
  if (!name) { modalErr('Name is required.'); return; }
  try {
    const res = await apiFetch({
      action: 'updateItem', sheet: S.activeSheet, box: S.activeBox, row,
      data: JSON.stringify({ name, labcollector:lab, date, glycerol, concentration:conc, volume:vol, preparer:prep })
    });
    if (res.error) throw new Error(res.error);
    closeModal();
    toast('Saved ✓');
    await refreshCurrent();
  } catch(e) { modalErr(e.message); }
}

/* ── Delete Item ───────────────────────────────────────────── */
async function doDelete(row) {
  const box  = findBox(S.activeBox, S.data);
  const item = box?.items.find(i => i._row === row);
  if (!confirm(`Delete "${item?.name || 'this item'}"?\nThis cannot be undone.`)) return;
  try {
    const res = await apiFetch({ action:'deleteItem', sheet:S.activeSheet, box:S.activeBox, row });
    if (res.error) throw new Error(res.error);
    toast('Deleted');
    await refreshCurrent();
  } catch(e) { toast('Error: ' + e.message, 5000); }
}

/* ── Grid cell modals ──────────────────────────────────────── */
function openGridEmptyModal(ri, ci) {
  openModal(`<div class="modal">
    <div class="modal-hd"><h3>Empty cell — row ${ri+1}, col ${ci+1}</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-bd">
      <div id="modal-err-wrap"></div>
      <div class="frow"><label>Label</label>
        <input class="finput" id="gv" placeholder="Box name (e.g. Box 5) or item name" autocomplete="off">
        <div class="fhint">A box name (matching a box in this sheet) turns this into a navigation cell.</div></div>
    </div>
    <div class="modal-ft">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="submitGridCell(${ri},${ci})">Set</button>
    </div>
  </div>`);
  setTimeout(() => document.getElementById('gv')?.focus(), 40);
}

function openGridItemModal(ri, ci, val) {
  openModal(`<div class="modal">
    <div class="modal-hd"><h3>Cell — row ${ri+1}, col ${ci+1}</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-bd">
      <div id="modal-err-wrap"></div>
      <div class="frow"><label>Label</label>
        <input class="finput" id="gv" value="${h(val)}" autocomplete="off"></div>
    </div>
    <div class="modal-ft">
      <button class="btn-danger2" onclick="submitGridCell(${ri},${ci},'')">Clear</button>
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="submitGridCell(${ri},${ci})">Save</button>
    </div>
  </div>`);
  setTimeout(() => { const el = document.getElementById('gv'); el?.focus(); el?.select(); }, 40);
}

async function submitGridCell(ri, ci, forceVal) {
  const val = forceVal !== undefined ? forceVal : (document.getElementById('gv')?.value?.trim() ?? '');
  if (forceVal === '' && !confirm('Clear this cell?')) return;
  try {
    const res = await apiFetch({ action:'updateGrid', sheet:S.activeSheet, gridRow:ri, gridCol:ci, value:val });
    if (res.error) throw new Error(res.error);
    closeModal();
    toast(val ? 'Label saved ✓' : 'Cell cleared');
    await loadSheet(S.activeSheet, true);
    render();
  } catch(e) { modalErr(e.message); }
}

/* ── Add Box ───────────────────────────────────────────────── */
function openAddBoxModal() {
  openModal(`<div class="modal">
    <div class="modal-hd"><h3>Create New Box</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-bd">
      <div id="modal-err-wrap"></div>
      <div class="frow req"><label>Box name</label>
        <input class="finput" id="bn" placeholder="e.g. Box 5, AAV Box" autocomplete="off">
        <div class="fhint">Adds header rows to your Google Sheet.</div></div>
    </div>
    <div class="modal-ft">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="submitAddBox()">Create</button>
    </div>
  </div>`);
  setTimeout(() => document.getElementById('bn')?.focus(), 40);
}

async function submitAddBox() {
  const name = document.getElementById('bn')?.value?.trim();
  if (!name) { modalErr('Name is required.'); return; }
  try {
    const res = await apiFetch({ action:'addBox', sheet:S.activeSheet, boxName:name });
    if (res.error) throw new Error(res.error);
    closeModal();
    toast(`Box "${name}" created ✓`);
    await loadSheet(S.activeSheet, true);
    render();
  } catch(e) { modalErr(e.message); }
}

/* ── Settings ──────────────────────────────────────────────── */
function openSettings() {
  const isDark = document.documentElement.dataset.theme === 'dark';
  openModal(`<div class="modal wide">
    <div class="modal-hd"><h3>⚙ Settings</h3><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-bd">
      <div class="settings-section">
        <h4>Connection</h4>
        <div class="frow"><label>Apps Script URL</label>
          <input class="finput" id="s-url" value="${h(S.url)}" style="font-size:11px;font-family:'IBM Plex Mono',monospace">
          <div class="fhint">Deploy → Web app (Execute as Me, Anyone can access)</div></div>
        <button class="btn-primary" style="width:100%;margin-top:8px" onclick="saveUrl()">Update URL &amp; Reconnect</button>
      </div>
      <div class="settings-section">
        <h4>Low Volume Warning</h4>
        <div class="toggle-row">
          <span class="toggle-lbl">Enable warning</span>
          <label class="toggle"><input type="checkbox" id="s-lv" ${S.lowVol.enabled?'checked':''}><span class="toggle-slider"></span></label>
        </div>
        <p style="font-size:12px;color:var(--text2);margin-bottom:10px">Warn when <em>both</em> concentration AND volume are below thresholds.</p>
        <div class="fgrid2">
          <div class="frow"><label>Conc threshold (ng/µL)</label><input class="finput" id="s-mc" type="number" step="1" min="0" value="${S.lowVol.minConc}"></div>
          <div class="frow"><label>Volume threshold (µL)</label><input class="finput" id="s-mv" type="number" step="1" min="0" value="${S.lowVol.minVol}"></div>
        </div>
      </div>
      <div class="settings-section">
        <h4>Appearance</h4>
        <div class="toggle-row">
          <span class="toggle-lbl">Dark mode</span>
          <label class="toggle"><input type="checkbox" id="s-dk" ${isDark?'checked':''} onchange="setTheme(this.checked)"><span class="toggle-slider"></span></label>
        </div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn-secondary" onclick="closeModal()">Close</button>
      <button class="btn-primary" onclick="saveSettings()">Save</button>
    </div>
  </div>`);
}

function saveUrl() {
  const u = document.getElementById('s-url')?.value?.trim();
  if (!u) return;
  S.url = u; localStorage.setItem('inv_url', u);
  S.cache = {}; S.data = null;
  closeModal(); init();
}

function saveSettings() {
  S.lowVol.enabled = !!document.getElementById('s-lv')?.checked;
  S.lowVol.minConc = parseFloat(document.getElementById('s-mc')?.value) || 10;
  S.lowVol.minVol  = parseFloat(document.getElementById('s-mv')?.value) || 5;
  localStorage.setItem('inv_lowvol', JSON.stringify(S.lowVol));
  closeModal(); toast('Settings saved'); render();
}

function setTheme(dark) {
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  localStorage.setItem('inv_theme', dark ? 'dark' : 'light');
}

/* ══════════════════════════════════════════════════════════════
   EVENT LISTENERS
══════════════════════════════════════════════════════════════ */
document.getElementById('search-input').addEventListener('input', e => {
  S.search = e.target.value; render();
});
document.getElementById('btn-settings').addEventListener('click', openSettings);
document.getElementById('btn-theme').addEventListener('click', () => {
  const isDark = document.documentElement.dataset.theme === 'dark'
    || (!document.documentElement.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
  setTheme(!isDark);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ══════════════════════════════════════════════════════════════
   START
══════════════════════════════════════════════════════════════ */
init();
</script>
</body>
</html>
