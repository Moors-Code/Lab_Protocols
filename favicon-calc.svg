<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Lab Calculator: beaker with math symbols -->
  <rect width="32" height="32" rx="7" fill="#0c7c59"/>
  <!-- Conical beaker -->
  <path d="M12 7 L12 15 L7 25 L25 25 L20 15 L20 7 Z"
        fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="1.8"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Top rim -->
  <line x1="11" y1="7" x2="21" y2="7" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Liquid fill -->
  <path d="M8.8 22 Q16 19 23.2 22 L25 25 L7 25 Z" fill="rgba(255,255,255,0.4)"/>
  <!-- "÷" symbol in liquid area -->
  <line x1="13" y1="22" x2="19" y2="22" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="14.5" cy="20.5" r="1" fill="white"/>
  <circle cx="17.5" cy="23.5" r="1" fill="white"/>
</svg>
