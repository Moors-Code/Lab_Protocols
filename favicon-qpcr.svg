<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- qPCR: amplification S-curve with axes -->
  <rect width="32" height="32" rx="7" fill="#0c7c59"/>
  <!-- Axes -->
  <line x1="6" y1="6"  x2="6"  y2="26" stroke="rgba(255,255,255,0.5)" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="6" y1="26" x2="27" y2="26" stroke="rgba(255,255,255,0.5)" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Threshold line (dashed) -->
  <line x1="6" y1="17" x2="27" y2="17" stroke="rgba(255,255,255,0.3)" stroke-width="1"
        stroke-dasharray="2.5 2" stroke-linecap="round"/>
  <!-- Sigmoid amplification curve -->
  <path d="M7 24 C9 24 10 24 12 23 C14 22 14 17 17 14 C20 11 21 8 24 7 L26 7"
        stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
