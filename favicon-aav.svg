<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- AAV Production: viral capsid (central circle + 6 surrounding dots) -->
  <rect width="32" height="32" rx="7" fill="#0c7c59"/>
  <!-- Core capsid -->
  <circle cx="16" cy="16" r="5" fill="white"/>
  <!-- Surface proteins / spikes (hexagonal arrangement) -->
  <circle cx="16" cy="7"  r="2.2" fill="white"/>
  <circle cx="23.6" cy="11.5" r="2.2" fill="white"/>
  <circle cx="23.6" cy="20.5" r="2.2" fill="white"/>
  <circle cx="16" cy="25" r="2.2" fill="white"/>
  <circle cx="8.4" cy="20.5" r="2.2" fill="white"/>
  <circle cx="8.4" cy="11.5" r="2.2" fill="white"/>
  <!-- Connect spikes to core with faint lines -->
  <line x1="16" y1="11" x2="16" y2="9.2"  stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <line x1="20.2" y1="13.5" x2="21.7" y2="13.1" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <line x1="20.2" y1="18.5" x2="21.7" y2="18.9" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <line x1="16" y1="21" x2="16" y2="22.8"  stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <line x1="11.8" y1="18.5" x2="10.3" y2="18.9" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <line x1="11.8" y1="13.5" x2="10.3" y2="13.1" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
</svg>
