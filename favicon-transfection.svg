<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Transfection Calculator: Erlenmeyer flask + droplet entering -->
  <rect width="32" height="32" rx="7" fill="#0c7c59"/>
  <!-- Flask body -->
  <path d="M13 8 L13 16 L7.5 24 L24.5 24 L19 16 L19 8 Z"
        fill="rgba(255,255,255,0.18)" stroke="white" stroke-width="1.8"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Flask neck cap -->
  <line x1="12" y1="8" x2="20" y2="8" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Liquid inside flask -->
  <path d="M9.8 21 Q16 18.5 22.2 21 L24.5 24 L7.5 24 Z"
        fill="rgba(255,255,255,0.45)"/>
  <!-- Bubbles -->
  <circle cx="13.5" cy="21" r="1.2" fill="white" opacity="0.7"/>
  <circle cx="17"   cy="19.5" r="0.9" fill="white" opacity="0.7"/>
</svg>
