<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Golden Gate Assembly: two DNA fragments joined at sticky ends -->
  <rect width="32" height="32" rx="7" fill="#0c7c59"/>
  <!-- Left fragment – top strand -->
  <line x1="5"  y1="12" x2="14" y2="12" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Left fragment – bottom strand (staggered) -->
  <line x1="5"  y1="20" x2="11" y2="20" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right fragment – top strand (staggered) -->
  <line x1="18" y1="12" x2="27" y2="12" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right fragment – bottom strand -->
  <line x1="21" y1="20" x2="27" y2="20" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Sticky-end overhang connectors (the joining part, highlighted) -->
  <line x1="14" y1="12" x2="14" y2="20" stroke="#7ee8c0" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="12" x2="18" y2="20" stroke="#7ee8c0" stroke-width="2" stroke-linecap="round"/>
  <!-- Gap with joining arrow/dot -->
  <line x1="14" y1="16" x2="18" y2="16" stroke="#7ee8c0" stroke-width="1.5"
        stroke-linecap="round" stroke-dasharray="1.5 1.5"/>
  <!-- Ligation site dot -->
  <circle cx="16" cy="16" r="2" fill="white"/>
  <!-- Vertical bonds on each fragment -->
  <line x1="9"  y1="12" x2="9"  y2="20" stroke="rgba(255,255,255,0.35)" stroke-width="1" stroke-linecap="round"/>
  <line x1="23" y1="12" x2="23" y2="20" stroke="rgba(255,255,255,0.35)" stroke-width="1" stroke-linecap="round"/>
</svg>
