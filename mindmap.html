<title>Lab Mind Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">

<style>
/* Design tokens – scientific: cool neutrals, amber questions, emerald experiments */
:root {
  --bg:#F2F4F7; --surf:#FFF; --surf2:#EAECF0;
  --fg:#1A1D27; --fg2:#5C607A; --bdr:#D1D5E0;
  --acc:#1D6FA4; --acc-h:#155A87; --acc-fg:#FFF;
  --q-bg:#FEF3C7; --q-bdr:#D97706; --q-fg:#78350F;
  --e-bg:#D1FAE5; --e-bdr:#059669; --e-fg:#064E3B;
  --edge:#94A3B8; --edge-sel:#1D6FA4;
  --sh:0 2px 8px rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.06);
  --r:10px; color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1117; --surf:#161B22; --surf2:#1C2230;
  --fg:#E2E5EF; --fg2:#9DA3B8; --bdr:#30364A;
  --acc:#58A6FF; --acc-h:#79BAFF; --acc-fg:#0D1117;
  --q-bg:#3B2A00; --q-bdr:#D97706; --q-fg:#FDE68A;
  --e-bg:#022C1A; --e-bdr:#059669; --e-fg:#6EE7B7;
  --edge:#4B5470; --edge-sel:#58A6FF;
  --sh:0 2px 8px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1117; --surf:#161B22; --surf2:#1C2230;
  --fg:#E2E5EF; --fg2:#9DA3B8; --bdr:#30364A;
  --acc:#58A6FF; --acc-h:#79BAFF; --acc-fg:#0D1117;
  --q-bg:#3B2A00; --q-bdr:#D97706; --q-fg:#FDE68A;
  --e-bg:#022C1A; --e-bdr:#059669; --e-fg:#6EE7B7;
  --edge:#4B5470; --edge-sel:#58A6FF;
  --sh:0 2px 8px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--fg);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  display:flex;flex-direction:column;
}

/* ── TOOLBAR ── */
#toolbar{
  height:52px;background:var(--surf);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:6px;flex-shrink:0;
  padding:0 max(12px,env(safe-area-inset-left,0px));
  box-shadow:0 1px 4px rgba(0,0,0,.06);z-index:10;position:relative;
}
#proj-title{
  font-size:14px;font-weight:600;color:var(--fg);background:transparent;
  border:1px solid transparent;border-radius:6px;padding:4px 8px;
  min-width:120px;max-width:200px;outline:none;transition:border-color .15s;
  font-family:inherit;
}
#proj-title:hover{border-color:var(--bdr)}
#proj-title:focus{border-color:var(--acc);background:var(--surf)}
.sep{width:1px;height:22px;background:var(--bdr);flex-shrink:0;margin:0 2px}
.tbtn{
  display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:6px;
  border:1px solid var(--bdr);background:var(--surf);color:var(--fg2);
  font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:all .12s;font-family:inherit;
}
.tbtn:hover{background:var(--surf2);color:var(--fg)}
.tbtn.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.tbtn.on:hover{background:var(--acc-h);border-color:var(--acc-h)}
.tbtn .k{font-size:10px;font-family:monospace;background:rgba(0,0,0,.08);border-radius:3px;padding:1px 4px;opacity:.65}
.tbtn.on .k{background:rgba(255,255,255,.18)}
.ico-q{color:#D97706} .ico-e{color:#059669}

/* ── CANVAS ── */
#canvas{flex:1;position:relative;overflow:hidden;cursor:default;background:var(--bg)}
#canvas::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle,var(--bdr) 1px,transparent 1px);
  background-size:28px 28px;opacity:.5;
}
#canvas.m-addq,#canvas.m-adde{cursor:crosshair}
#canvas.m-conn{cursor:cell}
#canvas.m-del{cursor:no-drop}
#canvas.panning{cursor:grabbing!important}
#tx{position:absolute;top:0;left:0;transform-origin:0 0}

/* SVG edges – full canvas overlay, outside #tx, synced via inner <g> transform */
#edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1}
#edges .ehit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer;pointer-events:stroke}
#edges .eline{fill:none;stroke-width:2;pointer-events:none;transition:stroke .1s}

/* ── NODES ── */
#nodes{position:absolute;top:0;left:0;pointer-events:none}
.node{
  position:absolute;pointer-events:all;
  border-radius:var(--r);border:2px solid var(--q-bdr);
  background:var(--q-bg);color:var(--q-fg);
  box-shadow:var(--sh);cursor:pointer;user-select:none;
  min-width:150px;max-width:220px;padding:9px 12px 8px;
  transform:translate(-50%,-50%);
  transition:box-shadow .12s,transform .12s;
}
.node:hover{box-shadow:var(--sh),0 0 0 3px rgba(217,119,6,.25);transform:translate(-50%,-50%) scale(1.02)}
.node.sel{box-shadow:var(--sh),0 0 0 3px var(--q-bdr)}
.node.drag{cursor:grabbing!important;z-index:50;
  box-shadow:var(--sh),0 10px 30px rgba(0,0,0,.18);
  transform:translate(-50%,-50%) scale(1.05)!important;transition:none}
.node.csrc{box-shadow:var(--sh),0 0 0 3px var(--acc)!important}
.node.exp{border-color:var(--e-bdr);background:var(--e-bg);color:var(--e-fg)}
.node.exp:hover{box-shadow:var(--sh),0 0 0 3px rgba(5,150,105,.25);transform:translate(-50%,-50%) scale(1.02)}
.node.exp.sel{box-shadow:var(--sh),0 0 0 3px var(--e-bdr)}
.nlbl{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;opacity:.5;margin-bottom:3px}
.ntxt{font-size:13px;font-weight:500;line-height:1.4;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nhint{font-size:10.5px;opacity:.45;margin-top:4px}
.nstat{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;
  border-radius:20px;padding:2px 7px;margin-top:5px;width:fit-content}
/* status variants applied to .node.exp directly */
.node.st-success{border-color:#059669;background:#D1FAE5}
.node.st-running{border-color:#2563EB;background:#DBEAFE}
.node.st-failure{border-color:#DC2626;background:#FEE2E2}
.node.st-repeat {border-color:#6B7280;background:#F3F4F6}
/* dark overrides */
@media(prefers-color-scheme:dark){
  .node.st-success{background:#022C1A;border-color:#059669}
  .node.st-running{background:#0C1A3A;border-color:#2563EB}
  .node.st-failure{background:#2D0A0A;border-color:#DC2626}
  .node.st-repeat {background:#1A1C22;border-color:#6B7280}
}
:root[data-theme="dark"] .node.st-success{background:#022C1A;border-color:#059669}
:root[data-theme="dark"] .node.st-running{background:#0C1A3A;border-color:#2563EB}
:root[data-theme="dark"] .node.st-failure{background:#2D0A0A;border-color:#DC2626}
:root[data-theme="dark"] .node.st-repeat {background:#1A1C22;border-color:#6B7280}

/* ── POPUP CARD ── */
#popup{
  position:fixed;z-index:80;
  background:var(--surf);border-radius:14px;
  box-shadow:0 4px 24px rgba(0,0,0,.16),0 0 0 1px var(--bdr);
  padding:18px;width:280px;
  animation:popIn .15s ease-out;
}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(4px)}to{opacity:1;transform:scale(1) translateY(0)}}
.pp-type{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;opacity:.45;margin-bottom:8px}
.pp-text{font-size:14px;font-weight:500;line-height:1.55;color:var(--fg);margin-bottom:12px;word-break:break-word}
.pp-link{
  display:flex;align-items:center;gap:7px;
  background:var(--e-bg);color:var(--e-fg);border:1px solid var(--e-bdr);
  text-decoration:none;border-radius:8px;padding:8px 12px;
  font-size:13px;font-weight:600;margin-bottom:10px;
  transition:filter .12s;
}
.pp-link:hover{filter:brightness(.95)}
.pp-link-icon{font-size:16px;flex-shrink:0}
.pp-nolink{font-size:12px;color:var(--fg2);opacity:.7;margin-bottom:10px}
.pp-row{display:flex;gap:8px}
.pp-edit{
  flex:1;padding:7px 10px;background:var(--acc);color:var(--acc-fg);
  border:none;border-radius:8px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:background .12s;
}
.pp-edit:hover{background:var(--acc-h)}
.pp-del{
  padding:7px 10px;background:transparent;color:#EF4444;
  border:1px solid #EF4444;border-radius:8px;font-size:13px;
  font-weight:500;cursor:pointer;font-family:inherit;transition:background .12s;
}
.pp-del:hover{background:#FEE2E2}
.pp-close{
  position:absolute;top:12px;right:12px;
  background:transparent;border:none;cursor:pointer;
  color:var(--fg2);opacity:.4;font-size:16px;padding:2px 5px;
  border-radius:4px;font-family:inherit;transition:opacity .1s;
}
.pp-close:hover{opacity:.8}

/* ── MODAL ── */
[hidden]{display:none!important}
#mbg{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  z-index:100;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-left,0px));
}
#modal{
  background:var(--surf);border-radius:14px;
  box-shadow:0 8px 40px rgba(0,0,0,.3);
  padding:22px;width:100%;max-width:400px;
  display:flex;flex-direction:column;gap:14px;
}
#modal h3{font-size:16px;font-weight:600}
.ff{display:flex;flex-direction:column;gap:5px}
.ff label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2)}
.ff textarea,.ff input{
  background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;
  padding:8px 10px;font-size:13.5px;color:var(--fg);font-family:inherit;
  outline:none;transition:border-color .12s;resize:none;
}
.ff textarea{min-height:72px}
.ff textarea:focus,.ff input:focus{border-color:var(--acc)}
.mbtns{display:flex;gap:8px;align-items:center;justify-content:space-between}
.btn-p{padding:8px 18px;background:var(--acc);color:var(--acc-fg);border:none;
  border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .12s}
.btn-p:hover{background:var(--acc-h)}
.btn-s{padding:8px 14px;background:var(--surf2);color:var(--fg);
  border:1px solid var(--bdr);border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-s:hover{filter:brightness(.95)}
.btn-d{padding:8px 14px;background:transparent;color:#EF4444;
  border:1px solid #EF4444;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .12s}
.btn-d:hover{background:#FEE2E2}

/* ── EMPTY STATE ── */
#empty{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;
  pointer-events:none;opacity:.4;text-align:center;padding:40px;
}
#empty .ei{font-size:44px}
#empty .et{font-size:17px;font-weight:600}
#empty .es{font-size:13px;color:var(--fg2);max-width:260px;line-height:1.5}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
  background:var(--fg);color:var(--bg);font-size:12px;font-weight:500;
  padding:6px 14px;border-radius:20px;z-index:50;
  pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;
}
#toast.show{opacity:1}

/* ── ZOOM ── */
#zw{position:fixed;bottom:14px;right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:2px;z-index:20}
.zbtn{
  width:30px;height:30px;border-radius:6px;border:1px solid var(--bdr);
  background:var(--surf);color:var(--fg);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.1);transition:background .12s;font-family:inherit;
}
.zbtn:hover{background:var(--surf2)}
</style>

<!-- TOOLBAR -->
<div id="toolbar">
  <input id="proj-title" type="text" value="Research Project" spellcheck="false">
  <div class="sep"></div>
  <button class="tbtn on" id="bsel">↖ Select <span class="k">S</span></button>
  <button class="tbtn" id="baddq"><span class="ico-q">?</span> Question <span class="k">Q</span></button>
  <button class="tbtn" id="badde"><span class="ico-e">⚗</span> Experiment <span class="k">E</span></button>
  <button class="tbtn" id="bconn">⇒ Connect <span class="k">C</span></button>
  <button class="tbtn" id="bdel">✕ Delete <span class="k">D</span></button>
  <div class="sep"></div>
  <button class="tbtn" id="bfit">⊡ Fit</button>
  <button class="tbtn" id="bclr">⊘ Clear</button>
  <div class="sep"></div>
  <button class="tbtn" id="bsave">💾 Save</button>
  <button class="tbtn" id="bload">📂 Load</button>
  <input type="file" id="fileIn" accept=".json" style="display:none">
</div>

<!-- CANVAS -->
<div id="canvas">
  <!-- SVG overlay covers full canvas; inner <g> gets pan/zoom transform -->
  <svg id="edges" xmlns="http://www.w3.org/2000/svg"><g id="edge-g"></g></svg>
  <div id="tx">
    <div id="nodes"></div>
  </div>
  <div id="empty">
    <div class="ei">🧬</div>
    <div class="et">Start your research map</div>
    <div class="es">Choose <b>Question</b> or <b>Experiment</b> from the toolbar, then click anywhere on the canvas.</div>
  </div>
</div>

<!-- ZOOM -->

  <button class="zbtn" id="bzin">+</button>

</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- POPUP (detail card, shown on node click) -->
<div id="popup" hidden style="position:fixed;z-index:80"></div>

<!-- MODAL (edit form) -->
<div id="mbg" hidden>
  <div id="modal">
    <h3 id="mtitle">Edit</h3>
    <div class="ff">
      <label for="mtxt">Label</label>
      <textarea id="mtxt" rows="3" placeholder="Describe this…"></textarea>
    </div>
    <div class="ff" id="murlrow">
      <label for="murl">eLABFTW Link</label>
      <input id="murl" type="url" placeholder="https://your-elab.server/experiments.php?id=…">
    </div>
    <div class="mbtns">
      <button class="btn-d" id="mmdel">Delete</button>
      <div style="display:flex;gap:8px">
        <button class="btn-s" id="mmcancel">Cancel</button>
        <button class="btn-p" id="mmsave">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── PROJECT / STATE ────────────────────────────────────────────────────────
const _params = new URLSearchParams(location.search);
const PROJECT_ID = _params.get('project') || 'default';
const SK = PROJECT_ID === 'default' ? 'lmm-v3' : 'lmm-v3-' + PROJECT_ID;
const REGISTRY_KEY = 'lmm-projects';

// Default title from project slug (prettify hyphens → spaces, title-case)
const _defaultTitle = PROJECT_ID === 'default' ? 'Research Project'
  : PROJECT_ID.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());

let S = { title: _defaultTitle, nodes:[], edges:[] };
let V = {
  mode:'select', pan:{x:0,y:0}, zoom:1,
  sel:null, cFrom:null,
  drag:null,   // {id, swx,swy,snx,sny, moved, startCx,startCy}
  panDrag:null,
  editId:null, tTimer:null, popId:null
};

function save(){
  try{
    localStorage.setItem(SK,JSON.stringify(S));
    // Update project registry so index.html can list projects
    const reg=JSON.parse(localStorage.getItem(REGISTRY_KEY)||'[]');
    const idx=reg.findIndex(p=>p.id===PROJECT_ID);
    const entry={id:PROJECT_ID,title:S.title,nodeCount:S.nodes.length,updated:Date.now()};
    if(idx>=0) reg[idx]=entry; else reg.push(entry);
    localStorage.setItem(REGISTRY_KEY,JSON.stringify(reg));
  }catch(e){}
}
async function saveFile(){
  const json=JSON.stringify(S,null,2);
  const safe=(S.title||'mindmap').replace(/[^a-zA-Z0-9_ -]/g,'_').trim()||'mindmap';
  const filename=safe+'.json';
  // Use artifact downloads capability when inside claude.ai viewer
  if(window.claude){
    try{
      const dl=await window.claude.use('downloads');
      if(dl){ await dl.save({filename,data:json}); return; }
    }catch(e){}
  }
  // Fallback for GitHub Pages / local file use
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
function loadFile(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.nodes||!d.edges) throw new Error('Invalid map file');
      S={title:'Research Project',nodes:[],edges:[],...d};
      save();
      document.getElementById('proj-title').value=S.title||'Research Project';
      renderNodes(); renderEdges(); fitAll(); syncEmpty();
    }catch(err){ alert('Could not load file: '+err.message); }
  };
  r.readAsText(file);
}
function load(){
  try{ const d=localStorage.getItem(SK); if(d) S={...S,...JSON.parse(d)} }catch(e){}
}

// ── DOM REFS ───────────────────────────────────────────────────────────────
const cvs=document.getElementById('canvas'),
  tx=document.getElementById('tx'),
  nLayer=document.getElementById('nodes'),
  empty=document.getElementById('empty'),
  toast=document.getElementById('toast'),
  popup=document.getElementById('popup'),
  mbg=document.getElementById('mbg'),
  mtitle=document.getElementById('mtitle'),
  mtxt=document.getElementById('mtxt'),
  murl=document.getElementById('murl'),
  murlrow=document.getElementById('murlrow');

// ── TRANSFORM ─────────────────────────────────────────────────────────────
function applyTx(){
  const t=`translate(${V.pan.x}px,${V.pan.y}px) scale(${V.zoom})`;
  tx.style.transform=t;
  // Keep SVG edge layer in sync (SVG uses unitless transform attr)
  document.getElementById('edge-g').setAttribute('transform',`translate(${V.pan.x},${V.pan.y}) scale(${V.zoom})`);
}
function toW(cx,cy){ return {x:(cx-V.pan.x)/V.zoom, y:(cy-V.pan.y)/V.zoom} }
function toScreen(wx,wy){
  const r=cvs.getBoundingClientRect();
  return {x:wx*V.zoom+V.pan.x+r.left, y:wy*V.zoom+V.pan.y+r.top};
}
function cPt(e){ const r=cvs.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top} }

// ── EDGE COLORS ───────────────────────────────────────────────────────────
const STATUS_EDGE={
  success:{color:'#059669', symbol:'✓', bold:true},
  running:{color:'#2563EB', symbol:'?', bold:false},
  failure:{color:'#DC2626', symbol:'✕', bold:true},
  repeat: {color:'#9CA3AF', symbol:'↺', bold:false},
};
function edgeStyle(toNode, sel){
  if(!sel && toNode?.type==='e' && toNode.status && STATUS_EDGE[toNode.status]){
    return STATUS_EDGE[toNode.status];
  }
  const cs=getComputedStyle(document.documentElement);
  const col=sel
    ? (cs.getPropertyValue('--edge-sel')||'#1D6FA4').trim()
    : (cs.getPropertyValue('--edge')||'#94A3B8').trim();
  return {color:col, symbol:null, bold:false};
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function renderAll(){ applyTx(); renderEdges(); renderNodes(); empty.hidden=S.nodes.length>0 }

// Find point on the rectangle boundary of a node where a line from (fromX,fromY) enters
function rectEdgePt(fromX,fromY,toX,toY,hw,hh){
  const dx=fromX-toX, dy=fromY-toY;
  const len=Math.sqrt(dx*dx+dy*dy); if(len<1) return {x:toX,y:toY};
  let s=Infinity;
  if(Math.abs(dx)>0.01) s=Math.min(s, hw*len/Math.abs(dx));
  if(Math.abs(dy)>0.01) s=Math.min(s, hh*len/Math.abs(dy));
  return {x:toX+s*dx/len, y:toY+s*dy/len};
}
// Get the outward direction of the side a boundary point sits on
function exitDir(pt,cx,cy,hw,hh){
  const rx=(pt.x-cx)/hw, ry=(pt.y-cy)/hh;
  if(Math.abs(rx)>=Math.abs(ry)) return {x:rx>0?1:-1,y:0};
  return {x:0,y:ry>0?1:-1};
}

function renderEdges(){
  const edgeG=document.getElementById('edge-g');
  edgeG.innerHTML='';
  for(const e of S.edges){
    const fn=S.nodes.find(n=>n.id===e.from), tn=S.nodes.find(n=>n.id===e.to);
    if(!fn||!tn) continue;
    const isSel=V.sel?.t==='edge'&&V.sel?.id===e.id;
    const {color:col, symbol, bold}=edgeStyle(tn, isSel);
    const sw=bold?3:2;

    // Read actual node DOM dimensions for precise edge intersection
    const fnEl=nLayer.querySelector(`[data-id="${fn.id}"]`);
    const tnEl=nLayer.querySelector(`[data-id="${tn.id}"]`);
    const fnHW=(fnEl?fnEl.offsetWidth/2:85)+6;
    const fnHH=(fnEl?fnEl.offsetHeight/2:38)+6;
    const tnHW=(tnEl?tnEl.offsetWidth/2:85)+6;
    const tnHH=(tnEl?tnEl.offsetHeight/2:38)+6;

    // Edge exit point on source, entry point on target
    const sp=rectEdgePt(tn.x,tn.y,fn.x,fn.y,fnHW,fnHH);
    const tp=rectEdgePt(fn.x,fn.y,tn.x,tn.y,tnHW,tnHH);

    // Direction vector for arrowhead
    const adx=tp.x-sp.x, ady=tp.y-sp.y;
    const alen=Math.sqrt(adx*adx+ady*ady); if(alen<1) continue;
    const nx=adx/alen, ny=ady/alen;

    // Bezier – control points extend outward from each node's exit side
    const aLen=14;
    const ex=tp.x-nx*aLen, ey=tp.y-ny*aLen; // arrowhead base
    const sd=exitDir(sp,fn.x,fn.y,fnHW,fnHH); // outward dir at source
    const td=exitDir(tp,tn.x,tn.y,tnHW,tnHH); // outward dir at target
    const dist=Math.min(Math.hypot(tp.x-sp.x,tp.y-sp.y)*0.42,130);
    let cpx1,cpy1,cpx2,cpy2;
    cpx1=sp.x+sd.x*dist; cpy1=sp.y+sd.y*dist;
    cpx2=ex+td.x*dist;   cpy2=ey+td.y*dist;
    const d=`M${sp.x} ${sp.y} C${cpx1} ${cpy1} ${cpx2} ${cpy2} ${ex} ${ey}`;

    // Arrowhead triangle
    const hw=bold?7:6;
    const lx=tp.x-nx*aLen-ny*hw, ly=tp.y-ny*aLen+nx*hw;
    const rx=tp.x-nx*aLen+ny*hw, ry=tp.y-ny*aLen-nx*hw;
    const arrowPts=`${tp.x},${tp.y} ${lx},${ly} ${rx},${ry}`;

    // Midpoint of bezier (t=0.5)
    const t=0.5, t1=1-t;
    const mx=t1*t1*t1*sp.x+3*t1*t1*t*cpx1+3*t1*t*t*cpx2+t*t*t*ex;
    const my=t1*t1*t1*sp.y+3*t1*t1*t*cpy1+3*t1*t*t*cpy2+t*t*t*ey;

    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','eg'); g.dataset.id=e.id;

    // Hit area
    const hit=document.createElementNS('http://www.w3.org/2000/svg','path');
    hit.setAttribute('d',d); hit.setAttribute('class','ehit');
    hit.addEventListener('click',ev=>{
      ev.stopPropagation(); closePopup();
      if(V.mode==='delete'){delEdge(e.id)}else{V.sel={t:'edge',id:e.id};renderEdges()}
    });

    // Line
    const vis=document.createElementNS('http://www.w3.org/2000/svg','path');
    vis.setAttribute('d',d);
    vis.setAttribute('class','eline'+(isSel?' sel':''));
    vis.setAttribute('stroke',col);
    vis.setAttribute('stroke-width',sw);

    // Arrowhead
    const arr=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    arr.setAttribute('points',arrowPts);
    arr.setAttribute('fill',col);
    arr.style.pointerEvents='none';

    g.appendChild(hit); g.appendChild(vis); g.appendChild(arr);

    // Midpoint symbol label (status indicator)
    if(symbol){
      const bg=document.createElementNS('http://www.w3.org/2000/svg','circle');
      bg.setAttribute('cx',mx); bg.setAttribute('cy',my); bg.setAttribute('r',10);
      bg.setAttribute('fill',col);
      bg.style.pointerEvents='none';
      const lbl=document.createElementNS('http://www.w3.org/2000/svg','text');
      lbl.setAttribute('x',mx); lbl.setAttribute('y',my+1);
      lbl.setAttribute('text-anchor','middle'); lbl.setAttribute('dominant-baseline','middle');
      lbl.setAttribute('fill','#fff');
      lbl.setAttribute('font-size','11');
      lbl.setAttribute('font-weight','700');
      lbl.setAttribute('font-family','system-ui,sans-serif');
      lbl.style.pointerEvents='none';
      lbl.textContent=symbol;
      g.appendChild(bg); g.appendChild(lbl);
    }

    edgeG.appendChild(g);
  }
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

const STATUS_META={
  success:{label:'✓ Success',  color:'#059669'},
  running:{label:'● Running',  color:'#2563EB'},
  failure:{label:'✕ Failure',  color:'#DC2626'},
  repeat: {label:'↺ Repeat',   color:'#6B7280'},
};

function nodeHTML(n){
  const lbl=n.type==='q'?'❓ Question':'⚗ Experiment';
  const txt=n.text||'…';
  const sm=n.status&&STATUS_META[n.status];
  const statHTML=sm?`<div class="nstat" style="color:${sm.color};background:${sm.color}18;border:1px solid ${sm.color}55">${sm.label}</div>`:'';
  return `<div class="nlbl">${lbl}</div>
    <div class="ntxt">${esc(txt)}</div>
    ${statHTML}
    <div class="nhint">Click to expand</div>`;
}

function renderNodes(){
  const old=new Map(); nLayer.querySelectorAll('.node').forEach(el=>old.set(el.dataset.id,el));
  const cur=new Set(S.nodes.map(n=>n.id));
  old.forEach((el,id)=>{ if(!cur.has(id)) el.remove() });
  for(const n of S.nodes){
    let el=old.get(n.id);
    if(!el){ el=document.createElement('div'); nLayer.appendChild(el); }
    const stCls=n.type==='e'&&n.status?` st-${n.status}`:'';
    el.className='node'+(n.type==='e'?' exp':'')+stCls
      +(V.sel?.t==='node'&&V.sel?.id===n.id?' sel':'')
      +(V.cFrom===n.id?' csrc':'');
    el.dataset.id=n.id;
    el.style.left=n.x+'px'; el.style.top=n.y+'px';
    el.innerHTML=nodeHTML(n);
  }
}

// ── NODE EVENT DELEGATION ─────────────────────────────────────────────────
nLayer.addEventListener('mousedown',e=>{
  if(e.button!==0) return;
  const ne=e.target.closest('.node'); if(!ne) return;
  e.stopPropagation();
  const id=ne.dataset.id, n=S.nodes.find(n=>n.id===id); if(!n) return;
  if(V.mode==='delete'){closePopup();delNode(id);return}
  if(V.mode==='connect'){closePopup();handleConn(id);return}
  if(V.mode==='select'){
    V.sel={t:'node',id}; renderNodes(); renderEdges();
    const cp=cPt(e),wp=toW(cp.x,cp.y);
    // Record drag start but don't commit until mouse actually moves
    V.drag={id,swx:wp.x,swy:wp.y,snx:n.x,sny:n.y,moved:false,startCx:e.clientX,startCy:e.clientY};
  }
});

// ── NODE OPS ──────────────────────────────────────────────────────────────
function addNode(type,wx,wy){
  const id='n'+Date.now()+Math.floor(Math.random()*999);
  S.nodes.push({id,type,text:'',url:'',x:Math.round(wx),y:Math.round(wy)});
  save(); renderAll(); setMode('select'); openModal(id);
}
function delNode(id){
  S.nodes=S.nodes.filter(n=>n.id!==id);
  S.edges=S.edges.filter(e=>e.from!==id&&e.to!==id);
  if(V.sel?.id===id) V.sel=null;
  if(V.cFrom===id) V.cFrom=null;
  save(); renderAll(); toast2('Node deleted');
}
function delEdge(id){
  S.edges=S.edges.filter(e=>e.id!==id);
  if(V.sel?.id===id) V.sel=null;
  save(); renderAll(); toast2('Connection deleted');
}

// ── CONNECT ───────────────────────────────────────────────────────────────
function handleConn(id){
  if(!V.cFrom){ V.cFrom=id; renderNodes(); toast2('Now click the target node',2500); return }
  if(V.cFrom===id){ V.cFrom=null; renderNodes(); return }
  if(!S.edges.find(e=>e.from===V.cFrom&&e.to===id)){
    S.edges.push({id:'e'+Date.now(),from:V.cFrom,to:id});
    save(); toast2('Connected!');
  } else toast2('Already connected');
  V.cFrom=null; renderAll();
}

// ── POPUP (detail card) ────────────────────────────────────────────────────
function openPopup(id){
  const n=S.nodes.find(n=>n.id===id); if(!n) return;
  V.popId=id;
  const hasUrl=n.url&&n.url.trim();
  const lbl=n.type==='q'?'❓ Research Question':'⚗ Experiment';
  const statusPicker=n.type==='e'?`
    <div style="margin-bottom:10px">
      <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;opacity:.45;margin-bottom:6px">Status</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        ${Object.entries(STATUS_META).map(([k,m])=>`
          <button class="pp-stat-btn${n.status===k?' active':''}" data-status="${k}"
            style="border:1px solid ${m.color};color:${m.color};background:${n.status===k?m.color+'22':'transparent'};
            border-radius:20px;padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">
            ${m.label}
          </button>`).join('')}
        ${n.status?`<button class="pp-stat-btn" data-status=""
            style="border:1px solid #999;color:#999;background:transparent;
            border-radius:20px;padding:3px 9px;font-size:11px;cursor:pointer;font-family:inherit">
            ✕ Clear
          </button>`:''}
      </div>
    </div>`:'';
  popup.innerHTML=`
    <button class="pp-close" id="pp-x">✕</button>
    <div class="pp-type">${lbl}</div>
    <div class="pp-text">${esc(n.text||'(no description yet)')}</div>
    ${statusPicker}
    ${hasUrl
      ? `<a class="pp-link" href="${esc(n.url)}" target="_blank" rel="noopener">
           <span class="pp-link-icon">↗</span>
           <span>Open in eLABFTW</span>
         </a>`
      : `<div class="pp-nolink">No eLABFTW link — click Edit to add one.</div>`
    }
    <div class="pp-row">
      <button class="pp-edit" id="pp-edit">✎ Edit</button>
      <button class="pp-del" id="pp-del">✕</button>
    </div>`;
  popup.hidden=false;

  // Position near node in screen space
  const sc=toScreen(n.x,n.y);
  const pw=280, ph=200;
  const vw=window.innerWidth, vh=window.innerHeight;
  let left=sc.x+20, top=sc.y-60;
  if(left+pw>vw-12) left=sc.x-pw-20;
  if(left<12) left=12;
  if(top+ph>vh-12) top=vh-ph-12;
  if(top<60) top=60;
  popup.style.left=left+'px'; popup.style.top=top+'px';

  document.getElementById('pp-x').addEventListener('click',closePopup);
  document.getElementById('pp-edit').addEventListener('click',()=>{closePopup();openModal(id)});
  document.getElementById('pp-del').addEventListener('click',()=>{closePopup();delNode(id)});
  popup.querySelectorAll('.pp-stat-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const nd=S.nodes.find(n=>n.id===id); if(!nd) return;
      nd.status=btn.dataset.status||undefined;
      save(); renderAll(); openPopup(id);
    });
  });
}

function closePopup(){ popup.hidden=true; V.popId=null }

// ── MODAL ─────────────────────────────────────────────────────────────────
function openModal(id){
  const n=S.nodes.find(n=>n.id===id); if(!n) return;
  V.editId=id;
  mtitle.textContent=n.type==='q'?'Edit Question':'Edit Experiment';
  mtxt.value=n.text||'';
  murl.value=n.url||'';
  murlrow.style.display=n.type==='e'?'flex':'none';
  mbg.hidden=false; setTimeout(()=>mtxt.focus(),10);
}
function closeModal(){ mbg.hidden=true; V.editId=null }
function saveModal(){
  const n=S.nodes.find(n=>n.id===V.editId); if(!n) return;
  n.text=mtxt.value.trim()||'…';
  n.url=murl.value.trim();
  save(); closeModal(); renderAll();
}
document.getElementById('mmsave').addEventListener('click',saveModal);
document.getElementById('mmcancel').addEventListener('click',()=>{
  // If cancelling a brand-new empty node, remove it
  const n=S.nodes.find(n=>n.id===V.editId);
  if(n&&!n.text){ delNode(V.editId); }
  closeModal();
});
document.getElementById('mmdel').addEventListener('click',()=>{ if(V.editId){delNode(V.editId);closeModal()} });
mbg.addEventListener('click',e=>{ if(e.target===mbg) closeModal() });
mtxt.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)) saveModal() });

// ── TOOLBAR ───────────────────────────────────────────────────────────────
const MODES=['select','add-q','add-e','connect','delete'];
const BTNS={select:'bsel','add-q':'baddq','add-e':'badde',connect:'bconn',delete:'bdel'};
const MCLS={select:'','add-q':'m-addq','add-e':'m-adde',connect:'m-conn',delete:'m-del'};
const MLBLS={select:'Select mode — click a node to expand it','add-q':'Click canvas to add question','add-e':'Click canvas to add experiment',connect:'Click source node, then target',delete:'Click a node or edge to delete'};

function setMode(m){
  V.mode=m; V.cFrom=null; closePopup();
  MODES.forEach(md=>{ const b=document.getElementById(BTNS[md]); if(b) b.classList.toggle('on',md===m) });
  cvs.className=''; if(MCLS[m]) cvs.classList.add(MCLS[m]);
  toast2(MLBLS[m],2000); renderNodes();
}
MODES.forEach(m=>{ const b=document.getElementById(BTNS[m]); if(b) b.addEventListener('click',()=>setMode(m)) });
document.getElementById('bfit').addEventListener('click',fitAll);
document.getElementById('bclr').addEventListener('click',e=>{
  if(e.shiftKey||S.nodes.length===0){ S.nodes=[];S.edges=[];V.sel=null;closePopup();save();renderAll();toast2('Map cleared') }
  else toast2('Hold Shift + click Clear to reset',3000);
});
document.getElementById('proj-title').addEventListener('change',e=>{S.title=e.target.value;save()});
document.getElementById('bsave').addEventListener('click',saveFile);
const fileIn=document.getElementById('fileIn');
document.getElementById('bload').addEventListener('click',()=>fileIn.click());
fileIn.addEventListener('change',e=>{ if(e.target.files[0]){ loadFile(e.target.files[0]); e.target.value=''; } });

// ── PAN + ZOOM ─────────────────────────────────────────────────────────────
function zoom(f,cx,cy){
  const r=cvs.getBoundingClientRect();
  cx=cx??r.width/2; cy=cy??r.height/2;
  const nz=Math.max(.15,Math.min(3,V.zoom*f)), ratio=nz/V.zoom;
  V.pan.x=cx-ratio*(cx-V.pan.x); V.pan.y=cy-ratio*(cy-V.pan.y);
  V.zoom=nz; applyTx();
}
document.getElementById('bzin').addEventListener('click',()=>zoom(1.2));
document.getElementById('bzout').addEventListener('click',()=>zoom(1/1.2));

cvs.addEventListener('wheel',e=>{
  e.preventDefault();
  const pt=cPt(e); zoom(e.deltaY<0?1.1:1/1.1,pt.x,pt.y);
},{passive:false});

cvs.addEventListener('mousedown',e=>{
  if(e.button===1||(e.button===0&&e.altKey)){
    e.preventDefault();
    V.panDrag={sx:e.clientX,sy:e.clientY,spx:V.pan.x,spy:V.pan.y};
    cvs.classList.add('panning'); return;
  }
  if(e.button!==0) return;
  // Click on canvas background
  const isCanvas=e.target===cvs||e.target===tx||e.target===edgSvg||e.target===nLayer;
  if(isCanvas){
    V.sel=null; V.cFrom=null; closePopup();
    if(V.mode==='add-q'||V.mode==='add-e'){
      const pt=cPt(e),wp=toW(pt.x,pt.y);
      addNode(V.mode==='add-q'?'q':'e',wp.x,wp.y);
    } else { renderNodes(); renderEdges() }
  }
});

document.addEventListener('mousemove',e=>{
  if(V.panDrag){
    V.pan.x=V.panDrag.spx+(e.clientX-V.panDrag.sx);
    V.pan.y=V.panDrag.spy+(e.clientY-V.panDrag.sy);
    applyTx(); return;
  }
  if(V.drag){
    const distMoved=Math.hypot(e.clientX-V.drag.startCx, e.clientY-V.drag.startCy);
    if(!V.drag.moved && distMoved>5){
      V.drag.moved=true;
      closePopup();
      const el=nLayer.querySelector(`[data-id="${V.drag.id}"]`);
      if(el) el.classList.add('drag');
    }
    if(V.drag.moved){
      const pt=cPt(e),wp=toW(pt.x,pt.y);
      const n=S.nodes.find(n=>n.id===V.drag.id); if(!n) return;
      n.x=Math.round(V.drag.snx+(wp.x-V.drag.swx));
      n.y=Math.round(V.drag.sny+(wp.y-V.drag.swy));
      const el=nLayer.querySelector(`[data-id="${n.id}"]`);
      if(el){ el.style.left=n.x+'px'; el.style.top=n.y+'px' }
      renderEdges();
    }
  }
});

document.addEventListener('mouseup',e=>{
  if(V.panDrag){ V.panDrag=null; cvs.classList.remove('panning') }
  if(V.drag){
    const {id, moved}=V.drag;
    const el=nLayer.querySelector(`[data-id="${id}"]`);
    if(el) el.classList.remove('drag');
    if(moved){ save() }
    else {
      // It was a click, not a drag — open the popup
      openPopup(id);
    }
    V.drag=null;
  }
});

// ── FIT ───────────────────────────────────────────────────────────────────
function fitAll(){
  if(!S.nodes.length) return;
  const xs=S.nodes.map(n=>n.x), ys=S.nodes.map(n=>n.y);
  const minX=Math.min(...xs)-150, maxX=Math.max(...xs)+150;
  const minY=Math.min(...ys)-100, maxY=Math.max(...ys)+100;
  const r=cvs.getBoundingClientRect();
  const s=Math.min(r.width/(maxX-minX),r.height/(maxY-minY),1.5)*.88;
  V.zoom=s; V.pan.x=r.width/2-s*(minX+maxX)/2; V.pan.y=r.height/2-s*(minY+maxY)/2;
  applyTx();
}

// ── KEYBOARD ─────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if(!mbg.hidden) return;
  const k=e.key;
  if(k==='s'||k==='S') setMode('select');
  else if(k==='q'||k==='Q') setMode('add-q');
  else if(k==='e'||k==='E') setMode('add-e');
  else if(k==='c'||k==='C') setMode('connect');
  else if(k==='d'||k==='D') setMode('delete');
  else if(k==='f'||k==='F') fitAll();
  else if(k==='+'||k==='=') zoom(1.2);
  else if(k==='-') zoom(1/1.2);
  else if(k==='Escape'){
    if(!popup.hidden){closePopup();return}
    if(V.cFrom){V.cFrom=null;renderNodes();return}
    setMode('select');
  }
  else if(k==='Delete'||k==='Backspace'){
    if(V.sel?.t==='node') delNode(V.sel.id);
    else if(V.sel?.t==='edge') delEdge(V.sel.id);
  }
});

// ── TOUCH PINCH ZOOM ──────────────────────────────────────────────────────
let td=null;
cvs.addEventListener('touchstart',e=>{if(e.touches.length===2)td=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});
cvs.addEventListener('touchmove',e=>{
  if(e.touches.length===2&&td){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    const cx=(e.touches[0].clientX+e.touches[1].clientX)/2, cy=(e.touches[0].clientY+e.touches[1].clientY)/2;
    const r=cvs.getBoundingClientRect();
    zoom(d/td,cx-r.left,cy-r.top); td=d; e.preventDefault();
  }
},{passive:false});
cvs.addEventListener('touchend',()=>{td=null},{passive:true});

// ── TOAST ─────────────────────────────────────────────────────────────────
function toast2(msg,dur=1600){
  toast.textContent=msg; toast.classList.add('show');
  clearTimeout(V.tTimer); V.tTimer=setTimeout(()=>toast.classList.remove('show'),dur);
}
