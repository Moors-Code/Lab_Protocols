<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#1a6b4a"/>
  <!-- Lines from center to nodes -->
  <line x1="16" y1="16" x2="7" y2="7" stroke="white" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="16" y1="16" x2="25" y2="7" stroke="white" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="16" y1="16" x2="5" y2="17" stroke="white" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="16" y1="16" x2="27" y2="17" stroke="white" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="16" y1="16" x2="8" y2="26" stroke="white" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="16" y1="16" x2="24" y2="26" stroke="white" stroke-width="1.5" stroke-opacity="0.8"/>
  <!-- Outer nodes -->
  <circle cx="7" cy="7" r="3" fill="white" fill-opacity="0.9"/>
  <circle cx="25" cy="7" r="3" fill="white" fill-opacity="0.9"/>
  <circle cx="5" cy="17" r="3" fill="white" fill-opacity="0.9"/>
  <circle cx="27" cy="17" r="3" fill="white" fill-opacity="0.9"/>
  <circle cx="8" cy="26" r="3" fill="white" fill-opacity="0.9"/>
  <circle cx="24" cy="26" r="3" fill="white" fill-opacity="0.9"/>
  <!-- Center node -->
  <circle cx="16" cy="16" r="4.5" fill="white"/>
</svg>
